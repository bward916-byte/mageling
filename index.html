<script>
'use strict';
// ============================================================
//  MAGELING — a wizard childhood, told in pictures
//  single-file HTML5 canvas RPG · no words in-game
// ============================================================
const TILE=32;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1,PORTRAIT=false;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  PORTRAIT=H>W;
  layoutUI();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));

// ---------- utils ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const TAU=Math.PI*2;
function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let R=Math.random;
const rnd=(a,b)=>a+R()*(b-a);
const ri=(a,b)=>Math.floor(a+R()*(b-a+1));
const pick=arr=>arr[Math.floor(R()*arr.length)];
function hsl(h,s,l,a){return a===undefined?`hsl(${h},${s}%,${l}%)`:`hsla(${h},${s}%,${l}%,${a})`;}
function shade(hex,amt){ // hex '#rrggbb' -> lighten/darken by amt(-1..1)
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>clamp(Math.round(amt>0?v+(255-v)*amt:v*(1+amt)),0,255);
  return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.closePath();}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

// ---------- audio (tiny synth) ----------
let AC=null,masterGain=null,muted=false;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();masterGain=AC.createGain();masterGain.gain.value=0.25;masterGain.connect(AC.destination);}catch(e){}}
function sfx(type){
  if(!AC||muted)return;if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(masterGain);
  const env=(a,d,v)=>{g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);o.start(t);o.stop(t+a+d+0.02);};
  switch(type){
    case 'bolt':o.type='triangle';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(220,t+0.12);env(0.005,0.12,0.5);break;
    case 'hit':o.type='square';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(60,t+0.1);env(0.005,0.1,0.4);break;
    case 'fire':o.type='sawtooth';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+0.35);env(0.01,0.35,0.6);break;
    case 'frost':o.type='sine';o.frequency.setValueAtTime(1400,t);o.frequency.exponentialRampToValueAtTime(400,t+0.4);env(0.01,0.4,0.5);break;
    case 'zap':o.type='square';o.frequency.setValueAtTime(2000,t);o.frequency.exponentialRampToValueAtTime(300,t+0.15);env(0.002,0.15,0.4);break;
    case 'heal':o.type='sine';o.frequency.setValueAtTime(440,t);o.frequency.linearRampToValueAtTime(880,t+0.3);env(0.02,0.35,0.5);break;
    case 'fizzle':o.type='sawtooth';o.frequency.setValueAtTime(300,t);o.frequency.linearRampToValueAtTime(90,t+0.3);env(0.02,0.3,0.35);break;
    case 'pickup':o.type='sine';o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+0.07);o.frequency.setValueAtTime(1320,t+0.14);env(0.005,0.25,0.5);break;
    case 'level':o.type='triangle';o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+0.1);o.frequency.setValueAtTime(784,t+0.2);o.frequency.setValueAtTime(1046,t+0.3);env(0.01,0.5,0.6);break;
    case 'meow':o.type='sine';o.frequency.setValueAtTime(700,t);o.frequency.linearRampToValueAtTime(1000,t+0.08);o.frequency.linearRampToValueAtTime(600,t+0.25);env(0.02,0.25,0.35);break;
    case 'hurt':o.type='sawtooth';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(80,t+0.2);env(0.005,0.2,0.5);break;
    case 'door':o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.setValueAtTime(330,t+0.12);o.frequency.setValueAtTime(440,t+0.24);env(0.01,0.4,0.5);break;
    case 'turn':o.type='sine';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(1200,t+0.5);env(0.02,0.5,0.4);break;
    case 'ui':o.type='sine';o.frequency.setValueAtTime(600,t);env(0.005,0.06,0.3);break;
  }
}

// ---------- input ----------
const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=1;audioInit();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();onKey(e.code);});
window.addEventListener('keyup',e=>{keys[e.code]=0;});
const touches={}; // id -> {x,y,sx,sy,role}
let stick={active:false,id:null,ox:0,oy:0,x:0,y:0,dx:0,dy:0,mag:0};
const UI={btns:[],stickBase:{x:0,y:0,r:0},hud:{}};
function layoutUI(){
  const pad=18,br=PORTRAIT?34:32;
  const sr=PORTRAIT?Math.min(70,W*0.16):Math.min(64,H*0.14);
  UI.stickBase={x:pad+sr+10,y:H-pad-sr-10,r:sr};
  // spell buttons: diamond layout, bottom-right
  const cx=W-pad-br*2.6,cy=H-pad-br*2.6,g=br*1.55;
  UI.btns=[
    {id:'fire',x:cx+g,y:cy,r:br},     // right  (A)
    {id:'frost',x:cx,y:cy+g,r:br},    // down   (B)
    {id:'heal',x:cx-g,y:cy,r:br},     // left   (X)
    {id:'zap',x:cx,y:cy-g,r:br},      // up     (Y)
  ];
  UI.hud={bag:{x:W-pad-26,y:pad+26,r:24},skill:{x:W-pad-26-58,y:pad+26,r:24},map:{x:W-pad-26-116,y:pad+26,r:24}};
}
function tPos(t){const r=canvas.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top};}
function tapAt(x,y){ // returns true if consumed by UI
  if(G.screen!=='play')return uiTap(x,y);
  for(const b of UI.btns){if(dist(x,y,b.x,b.y)<b.r+8){castSpell(b.id);return true;}}
  for(const k in UI.hud){const h=UI.hud[k];if(dist(x,y,h.x,h.y)<h.r+6){openScreen(k);return true;}}
  return false;
}
canvas.addEventListener('touchstart',e=>{e.preventDefault();audioInit();for(const t of e.changedTouches){const p=tPos(t);if(tapAt(p.x,p.y)){touches[t.identifier]={role:'ui'};continue;}
  if(!stick.active&&(p.x<W*0.5||G.screen!=='play')){stick={active:true,id:t.identifier,ox:p.x,oy:p.y,x:p.x,y:p.y,dx:0,dy:0,mag:0};touches[t.identifier]={role:'stick'};}
  else touches[t.identifier]={role:'none'};}},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(stick.active&&t.identifier===stick.id){const p=tPos(t);stickMove(p.x,p.y);}}},{passive:false});
function stickMove(x,y){let dx=x-stick.ox,dy=y-stick.oy;const m=Math.hypot(dx,dy),max=UI.stickBase.r*0.9;if(m>max){stick.ox=x-dx/m*max;stick.oy=y-dy/m*max;dx=dx/m*max;dy=dy/m*max;}stick.x=x;stick.y=y;stick.dx=dx/max;stick.dy=dy/max;stick.mag=Math.min(1,m/max);}
function endTouch(e){e.preventDefault();for(const t of e.changedTouches){if(stick.active&&t.identifier===stick.id){stick.active=false;stick.dx=stick.dy=stick.mag=0;}delete touches[t.identifier];}}
canvas.addEventListener('touchend',endTouch,{passive:false});canvas.addEventListener('touchcancel',endTouch,{passive:false});
// mouse (desktop fallback)
let mouseDown=false;
canvas.addEventListener('mousedown',e=>{audioInit();const p=tPos(e);if(tapAt(p.x,p.y))return;if(G.screen!=='play')return;mouseDown=true;stick={active:true,id:'m',ox:p.x,oy:p.y,x:p.x,y:p.y,dx:0,dy:0,mag:0};});
canvas.addEventListener('mousemove',e=>{if(mouseDown&&stick.active){const p=tPos(e);stickMove(p.x,p.y);}});
window.addEventListener('mouseup',()=>{mouseDown=false;if(stick.id==='m'){stick.active=false;stick.dx=stick.dy=stick.mag=0;}});
// gamepad
let gpOK=typeof navigator!=='undefined'&&!!navigator.getGamepads;const gpPrev={};
function pollGamepad(){
  if(!gpOK)return null;let gps;try{gps=navigator.getGamepads();}catch(e){gpOK=false;return null;}
  const gp=gps&&(gps[0]||gps[1]||gps[2]||gps[3]);if(!gp)return null;
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  const b=i=>gp.buttons[i]&&gp.buttons[i].pressed;
  const edge=(name,v)=>{const was=gpPrev[name];gpPrev[name]=v;return v&&!was;};
  if(edge('A',b(0)))onKey('KeyJ');if(edge('B',b(1)))onKey('KeyK');if(edge('X',b(2)))onKey('KeyL');if(edge('Y',b(3)))onKey('KeyI');
  if(edge('sel',b(8)))onKey('Tab');if(edge('start',b(9)))onKey('Enter');if(edge('L',b(4)))onKey('KeyQ');if(edge('R',b(5)))onKey('KeyE');
  let dx=Math.abs(ax)>0.18?ax:0,dy=Math.abs(ay)>0.18?ay:0;
  if(b(12))dy=-1;if(b(13))dy=1;if(b(14))dx=-1;if(b(15))dx=1;
  return{dx,dy};
}
function moveVector(){ // screen-space intent
  let dx=0,dy=0;
  if(keys.ArrowLeft||keys.KeyA)dx-=1;if(keys.ArrowRight||keys.KeyD)dx+=1;if(keys.ArrowUp||keys.KeyW)dy-=1;if(keys.ArrowDown||keys.KeyS)dy+=1;
  const g=pollGamepad();if(g){dx+=g.dx;dy+=g.dy;}
  if(stick.active){dx+=stick.dx;dy+=stick.dy;}
  const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}
  return{dx,dy,m:Math.min(1,m)};
}

const TOWNS=[
 {name:'Bramblebrook',style:'cottage',ground:'#7ccf5a',ground2:'#6dbf4d',path:'#d9b871',water:'#4fb8e8',roof:['#e2523c','#f2a33a','#7c4fd3','#3aa6f2','#ef6ba8','#3fbf8f'],wall:['#fbe9c8','#f6dba9','#eee2d5','#f9f1e0'],trim:'#6b4a2b',accent:'#ffd54a',sky:'#ffeaa7'},
 {name:'Lilypool',style:'stilt',ground:'#6fc98a',ground2:'#5cb97a',path:'#c9b98a',water:'#3ba7d9',roof:['#2f9ac9','#43c1b0','#7f6bd9','#e8a13a','#e25d8f','#5cc95e'],wall:['#e6d3a8','#d9c28e','#f1e3bf','#c9b287'],trim:'#4f3a22',accent:'#8bf2ff',sky:'#c8f2ff'},
 {name:'Stonehollow',style:'stone',ground:'#8fb87a',ground2:'#7fa86a',path:'#b3aa98',water:'#4e9fd8',roof:['#5c6fd9','#a35cd9','#d95c8a','#d9a35c','#5cbfd9','#7fd95c'],wall:['#c9c3b8','#b8b2a6','#d8d2c6','#a9a397'],trim:'#3d3a45',accent:'#ff9de2',sky:'#dfe6ff'},
 {name:'Sunmirage',style:'oasis',ground:'#f0d27a',ground2:'#e6c66a',path:'#d9b25a',water:'#2fc0e0',roof:['#2ea0c8','#e05a7a','#6a50d8','#f0a030','#30c080','#d040c0'],wall:['#f7e9c9','#f0dcb0','#fff3d6','#eed9a8'],trim:'#8a5a2a',accent:'#ff7a3a',sky:'#ffd9a0'},
 {name:'Prismreach',style:'crystal',ground:'#a4a0e6',ground2:'#9490d8',path:'#dcd8ff',water:'#7fe8ff',roof:['#ff6fd8','#6fe8ff','#c86fff','#ffe66f','#6fffb0','#ff8f6f'],wall:['#f2efff','#e6e2ff','#ffffff','#dcd6ff'],trim:'#5a3f9a',accent:'#ffffff',sky:'#e8d8ff'},
];
const BIOMES=[
 {name:'Whisperwood',type:'forest',ground:'#5fae4f',ground2:'#52a044',path:'#b89a63',water:'#3f9fd8',enemies:['slime','bat','wolf'],boss:'treant',treeHue:[100,140],dec:['flower','mushroom','rock','stump'],sky:'#bfe7a5'},
 {name:'Murkfen',type:'swamp',ground:'#5f8a55',ground2:'#4f7a48',path:'#8f8a5a',water:'#3a7a6a',enemies:['frog','bat','ghost'],boss:'bogking',treeHue:[70,95],dec:['reed','mushroom','rock','lily'],sky:'#9fbfa0'},
 {name:'Frostcrag',type:'mountain',ground:'#e8f2fa',ground2:'#d8e8f4',path:'#b8c8d4',water:'#88c8f0',enemies:['yeti','icebat','golem'],boss:'frostwyrm',treeHue:[170,200],dec:['rock','crystal','snowflower','stump'],sky:'#d8ecff'},
 {name:'Emberdune',type:'desert',ground:'#f2d27c',ground2:'#e8c66c',path:'#d4a852',water:'#3fc4e8',enemies:['scorpion','sandworm','djinn'],boss:'sphinx',treeHue:[40,60],dec:['cactus','rock','bones','flower'],sky:'#ffe3b0'},
 {name:'Voidrift',type:'void',ground:'#4a3d7a',ground2:'#3e3268',path:'#7a6ab8',water:'#2a1a5a',enemies:['shade','eye','golem','djinn'],boss:'umbra',treeHue:[270,300],dec:['crystal','rock','voidflower','crystal'],sky:'#2a1a4a'},
];
// ages: sprite scale + look
const AGES=[
 {name:'child',scale:0.80,beard:0,hatH:1.0},
 {name:'youth',scale:0.95,beard:0,hatH:1.1},
 {name:'adult',scale:1.10,beard:0.5,hatH:1.2},
 {name:'elder',scale:1.20,beard:1.0,hatH:1.3},
];
// ============================================================
//  ITEM CATALOG — only magical things
// ============================================================
const RARITY={common:{c:'#cfd8dc',n:0,mult:1},rare:{c:'#42a5f5',n:1,mult:1.6},epic:{c:'#ab47bc',n:2,mult:2.4},legend:{c:'#ffb300',n:3,mult:3.5}};
const SLOTS=['hat','robe','staff','charm','boots'];
const ITEMS={
 hat:[{k:'hat_patch',r:'common',col:'#7b6fd6',star:'#ffe66d',hp:5},{k:'hat_moon',r:'rare',col:'#3d5afe',star:'#e0f7fa',mana:15,focus:1},{k:'hat_ember',r:'rare',col:'#ff6d3a',star:'#ffd54f',power:2},{k:'hat_owl',r:'epic',col:'#5d4037',star:'#ffcc80',focus:2,mana:20},{k:'hat_storm',r:'epic',col:'#26c6da',star:'#ffffff',power:3,aim:1},{k:'hat_astral',r:'legend',col:'#1a1140',star:'#ff4fd8',focus:3,mana:40,power:4}],
 robe:[{k:'robe_wool',r:'common',col:'#8e6cd6',hp:10},{k:'robe_forest',r:'common',col:'#3fae5a',hp:12,speed:0.1},{k:'robe_tide',r:'rare',col:'#2b9fd6',hp:20,mana:10},{k:'robe_ash',r:'rare',col:'#ef5350',hp:18,power:2},{k:'robe_glacier',r:'epic',col:'#80deea',hp:35,armor:2},{k:'robe_nightsky',r:'epic',col:'#1e2a6a',hp:30,mana:30},{k:'robe_sunweave',r:'legend',col:'#ffb300',hp:60,armor:3,power:3},{k:'robe_prism',r:'legend',col:'#ff6fd8',hp:50,mana:40,armor:2}],
 staff:[{k:'staff_twig',r:'common',col:'#8d6e63',gem:'#a5d6a7',dmg:4,rate:0.55},{k:'staff_oak',r:'common',col:'#6d4c41',gem:'#ffe082',dmg:6,rate:0.5},{k:'staff_coral',r:'rare',col:'#ff8a65',gem:'#4fc3f7',dmg:8,rate:0.45,shots:2},{k:'staff_frost',r:'rare',col:'#90caf9',gem:'#e1f5fe',dmg:9,rate:0.42,slow:1},{k:'staff_thunder',r:'epic',col:'#5c6bc0',gem:'#fff176',dmg:12,rate:0.36,pierce:1},{k:'staff_serpent',r:'epic',col:'#2e7d32',gem:'#ff5252',dmg:14,rate:0.4,shots:3},{k:'staff_phoenix',r:'legend',col:'#ff7043',gem:'#ffab00',dmg:18,rate:0.3,shots:3,pierce:1},{k:'staff_void',r:'legend',col:'#311b92',gem:'#ea80fc',dmg:22,rate:0.34,shots:2,pierce:2}],
 charm:[{k:'charm_clover',r:'common',col:'#66bb6a',luck:1},{k:'charm_heart',r:'rare',col:'#ef5350',regen:1},{k:'charm_moon',r:'rare',col:'#7e57c2',manaRegen:1},{k:'charm_eye',r:'epic',col:'#26a69a',aim:3},{k:'charm_star',r:'epic',col:'#ffee58',focus:3},{k:'charm_dragon',r:'legend',col:'#ff5722',power:5,armor:2}],
 boots:[{k:'boots_soft',r:'common',col:'#a1887f',speed:0.15},{k:'boots_river',r:'rare',col:'#4dd0e1',speed:0.25,armor:1},{k:'boots_wind',r:'epic',col:'#b2ff59',speed:0.45},{k:'boots_cloud',r:'legend',col:'#f8bbd0',speed:0.55,armor:2,regen:1}],
};
function makeItem(slot,key){const def=ITEMS[slot].find(i=>i.k===key);return Object.assign({slot},def);}
function rollItem(depth,forceR){ // depth 0..4; rarity weighted; returns item
  const rr=R();let r=forceR;
  if(!r){const pR=0.10+depth*0.06,pE=0.03+depth*0.04,pL=0.005+depth*0.012;r=rr<pL?'legend':rr<pL+pE?'epic':rr<pL+pE+pR?'rare':'common';}
  const slot=pick(SLOTS);const pool=ITEMS[slot].filter(i=>i.r===r);
  if(!pool.length){const p2=ITEMS[slot];return makeItem(slot,pick(p2).k);}
  return makeItem(slot,pick(pool).k);
}

// ============================================================
//  SPRITE FACTORY — pre-rendered variants
// ============================================================
const SPR={};
function sprite(name,w,h,fn){const c=mkCanvas(w,h);const g=c.getContext('2d');const saved=ctx;fn(g,w,h);SPR[name]=c;return c;}
function withCtx(g,fn){const saved=ctx;ctxSet(g);fn();ctxSet(saved);}
let _ctxRef=null;function ctxSet(g){_ctxRef=g;}
// small helper drawing functions working on any context
function gcirc(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
function gell(g,x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fill();}
function grr(g,x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill();}
function gpoly(g,pts,col){g.fillStyle=col;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fill();}

function buildSprites(){
  const rs=mulberry(7777);R=rs;
  // ---- TREES per biome: 6 variants each ----
  for(let b=0;b<BIOMES.length;b++){const bi=BIOMES[b];
    for(let v=0;v<6;v++)sprite('tree'+b+'_'+v,64,80,(g,w,h)=>{
      const hue=rnd(bi.treeHue[0],bi.treeHue[1]);const type=bi.type;
      gell(g,32,74,18,5,'rgba(0,0,0,0.18)');

const T_GRASS=0,T_GRASS2=1,T_PATH=2,T_WATER=3,T_ALT=4,T_BRIDGE=5,T_FLOOR=6,T_PRISM_A=7,T_PRISM_B=8,T_ARCH=9,T_GATE=10,T_BED=11,T_PLAZA=12;
// solid: 0 open, 1 solid, 2 prism-A (solid when rot even), 3 prism-B (solid when rot odd)
class GameMap{
  constructor(w,h){this.w=w;this.h=h;this.g=new Uint8Array(w*h);this.s=new Uint8Array(w*h);this.objs=[];this.houses=[];this.npcs=[];this.cats=[];this.enemies=[];this.chests=[];this.pickups=[];this.projs=[];this.parts=[];this.tower=null;this.arches=[];this.spawn={x:0,y:0};this.exitR=null;this.exitL=null;this.boss=null;this.gateOpen=false;this.bossArena=null;this.tint=null;}
  in(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h;}
  gt(x,y){return this.in(x,y)?this.g[y*this.w+x]:T_WATER;}
  st(x,y){return this.in(x,y)?this.s[y*this.w+x]:1;}
  set(x,y,t){if(this.in(x,y))this.g[y*this.w+x]=t;}
  solid(x,y,rot){const s=this.st(x,y);if(s===0)return false;if(s===1)return true;if(s===2)return rot%2===0;return rot%2===1;}
  block(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(this.in(i,j))this.s[j*this.w+i]=1;}
  free(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(this.in(i,j))this.s[j*this.w+i]=0;}
  isClear(x,y,w,h){for(let j=y-1;j<y+h+1;j++)for(let i=x-1;i<x+w+1;i++){if(!this.in(i,j))return false;const g=this.g[j*this.w+i];if(this.s[j*this.w+i]||g===T_WATER||g===T_PATH||g===T_PLAZA||g===T_ARCH||g===T_PRISM_A||g===T_PRISM_B||g===T_FLOOR||g===T_BRIDGE)return false;}return true;}
}
function fillRect(m,x,y,w,h,t){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)m.set(i,j,t);}
function fillCirc(m,cx,cy,r,t){for(let j=Math.floor(cy-r);j<=cy+r;j++)for(let i=Math.floor(cx-r);i<=cx+r;i++)if((i-cx)**2+(j-cy)**2<=r*r)m.set(i,j,t);}
function road(m,x0,y0,x1,y1,wd,t){ // L-shaped or straight road
  const t2=t===undefined?T_PATH:t;
  const h=Math.abs(x1-x0)>=Math.abs(y1-y0);
  if(h){fillRect(m,Math.min(x0,x1),y0-Math.floor(wd/2),Math.abs(x1-x0)+1,wd,t2);fillRect(m,x1-Math.floor(wd/2),Math.min(y0,y1),wd,Math.abs(y1-y0)+1,t2);}
  else{fillRect(m,x0-Math.floor(wd/2),Math.min(y0,y1),wd,Math.abs(y1-y0)+1,t2);fillRect(m,Math.min(x0,x1),y1-Math.floor(wd/2),Math.abs(x1-x0)+1,wd,t2);}
}
function addObj(m,spr,tx,ty,solidW,solidH,extra){const o=Object.assign({spr,x:tx*TILE+TILE/2,y:(ty+1)*TILE,tx,ty},extra||{});m.objs.push(o);if(solidW)m.block(tx-Math.floor((solidW-1)/2),ty-solidH+1,solidW,solidH);return o;}
function speckle(m,fn){for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++)fn(x,y);}
function placeDecor(m,names,count,cond){let tries=count*8;while(count>0&&tries-->0){const x=ri(1,m.w-2),y=ri(1,m.h-2);if(m.st(x,y)||m.gt(x,y)===T_WATER||m.gt(x,y)===T_PATH||m.gt(x,y)===T_PLAZA||m.gt(x,y)===T_ARCH||m.gt(x,y)===T_FLOOR||m.gt(x,y)===T_BRIDGE)continue;if(cond&&!cond(x,y))continue;const n=pick(names);const solidDec=['rock','stump','well','fence','crystal','cactus','lantern','stone_lamp','barrel','crate'].includes(n);addObj(m,n+'_'+ri(0,4),x,y,solidDec?1:0,1,{small:true});count--;}}
// prism puzzle nook: arch entrance, prism walls, chest behind
function prismNook(m,x,y,w,h,depth,orient){
  // clear area, floor it
  fillRect(m,x,y,w,h,T_FLOOR);m.free(x,y,w,h);
  // border walls of prism type A (solid at rot even) except an inner corridor of type B
  for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){const edge=i===x||i===x+w-1||j===y||j===y+h-1;if(edge){m.set(i,j,T_PRISM_A);m.s[j*m.w+i]=2;}}
  // arch tile at entrance (bottom middle), opening in wall
  const ax=x+Math.floor(w/2),ay=y+h-1;m.set(ax,ay,T_ARCH);m.s[ay*m.w+ax]=0;for(let k=1;k<=2;k++){m.set(ax,ay+k,T_PATH);m.s[(ay+k)*m.w+ax]=0;}m.arches.push({tx:ax,ty:ay});
  // inner: a ring of B-walls (open at even rotation) around the chest, and a second arch off to the side.
  const cx=x+Math.floor(w/2),cy=y+2;
  for(let j=cy-1;j<=cy+1;j++)for(let i=cx-1;i<=cx+1;i++){if(i===cx&&j===cy)continue;m.set(i,j,T_PRISM_B);m.s[j*m.w+i]=3;}
  const a2x=x+2,a2y=y+h-3;m.set(a2x,a2y,T_ARCH);m.s[a2y*m.w+a2x]=0;m.arches.push({tx:a2x,ty:a2y});
  // a few A pillars for texture
  m.set(x+w-3,y+2,T_PRISM_A);m.s[(y+2)*m.w+x+w-3]=2;m.set(x+w-3,y+4,T_PRISM_A);m.s[(y+4)*m.w+x+w-3]=2;
  m.chests.push({x:cx*TILE+TILE/2,y:cy*TILE+TILE/2,open:false,depth,legend:R()<0.3});
  // decor crystals around
  for(let i=0;i<3;i++)addObj(m,'crystal_'+ri(0,4),x+ri(1,w-2),y+ri(1,h-2),0,1,{small:true});
}

  speckle(m,(x,y)=>{if(m.st(x,y)||m.gt(x,y)!==T_GRASS&&m.gt(x,y)!==T_GRASS2)return;const edge=x<2||y<2||x>=m.w-2||y>=m.h-2;
    const inArena=dist(x,y,ax,ay)<10;if(inArena)return;

    prismNook(m,nx,ny,9,7,idx+1,0);

const G={screen:'intro',introStep:0,t:0,seq:0,map:null,player:null,keys:[],cleared:[],visited:[0],towersOpened:[],chestsOpened:{},gold:0,potions:1,manaPots:1,rot:0,rotTarget:0,rotAnim:0,rotDir:0,archCool:0,cam:{x:0,y:0},msg:[],shake:0,shop:null,travelAnim:0,bossBanner:0,story:[],flash:0,levelFx:0,ageFx:0,statOK:true,touchHint:6};
function seqInfo(i){return i%2===0?{kind:'town',idx:i/2}:{kind:'biome',idx:(i-1)/2};}
function newPlayer(){return{x:0,y:0,vx:0,vy:0,hp:60,mana:50,lvl:1,xp:0,skillPts:0,skills:{aim:0,focus:0,vigor:0,arcana:0,swift:0},equip:{hat:makeItem('hat','hat_patch'),robe:makeItem('robe','robe_wool'),staff:makeItem('staff','staff_twig'),charm:null,boots:null},bag:[],facing:1,aimA:0,walk:0,moving:false,invul:0,fireCd:0,cds:{fire:0,frost:0,heal:0,zap:0},age:0,cast:null,dead:0,regenT:0,castFx:0};}
function stats(){const p=G.player,s=p.skills;const st={maxHp:60+s.vigor*12,maxMana:50+s.arcana*10,power:1+s.arcana*0.08,speed:1+s.swift*0.06,armor:0,dmg:0,rate:0.5,shots:1,pierce:0,slow:0,regen:0,manaRegen:0,luck:0,aim:s.aim,focus:s.focus};
  for(const k of SLOTS){const it=p.equip[k];if(!it)continue;const mu=1;st.maxHp+=(it.hp||0);st.maxMana+=(it.mana||0);st.power+=(it.power||0)*0.1;st.speed+=(it.speed||0);st.armor+=(it.armor||0);if(it.dmg)st.dmg=it.dmg;if(it.rate)st.rate=it.rate;st.shots+=(it.shots||1)-1;st.pierce+=(it.pierce||0);st.slow+=(it.slow||0);st.regen+=(it.regen||0);st.manaRegen+=(it.manaRegen||0);st.luck+=(it.luck||0);st.aim+=(it.aim||0);st.focus+=(it.focus||0);}
  const ageB=[0,0.1,0.25,0.4][p.age];st.power+=ageB;st.maxHp+=p.age*15;st.maxMana+=p.age*20;
  return st;}
function xpNeed(l){return Math.round(18*Math.pow(l,1.45));}
function toast(icon,col){G.msg.push({icon,col:col||'#fff',t:2.2,y:0});if(G.msg.length>4)G.msg.shift();}
function addPart(x,y,col,n,spd,life,size,grav){const m=G.map;for(let i=0;i<n;i++){const a=R()*TAU,s=rnd(0.2,1)*spd;m.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,t:life*rnd(0.6,1),life:life,sz:size||3,g:grav||0});}}

// ---------- world travel ----------
function loadSeq(i,fromLeft){
  G.seq=i;const info=seqInfo(i);
  G.map=info.kind==='town'?genTown(info.idx):genBiome(info.idx);
  const m=G.map;
  if(m.kind==='biome'&&G.cleared[m.idx]){m.gateOpen=true;m.enemies=m.enemies.filter(e=>!e.boss);for(const [x,y] of m.gateTiles){m.set(x,y,T_PATH);m.s[y*m.w+x]=0;}}
  const openSet=G.chestsOpened[i]||[];m.chests.forEach((c,ci)=>{if(openSet.includes(ci))c.open=true;});
  if(m.tower){m.tower.locked=!G.keys[m.idx];m.tower.opened=!!G.towersOpened[m.idx];}
  if(m.kind==='town'&&!G.visited.includes(m.idx))G.visited.push(m.idx);
  const p=G.player;
  if(fromLeft===false&&m.exitR){p.x=m.exitR.x-48;p.y=m.exitR.y;}else{p.x=m.spawn.x;p.y=m.spawn.y;}
  p.vx=p.vy=0;G.rot=0;G.rotTarget=0;G.rotAnim=0;G.cam.x=p.x;G.cam.y=p.y;G.travelAnim=1;G.bossBanner=0;
  save();
}
function tryExit(){const p=G.player,m=G.map;
  if(m.exitR&&p.x>m.exitR.x-20&&Math.abs(p.y-m.exitR.y)<64){
    if(m.kind==='biome'&&!m.gateOpen){p.x=m.exitR.x-24;return;}
    if(G.seq+1>=TOWNS.length*2)return;
    loadSeq(G.seq+1,true);return;}
  if(m.exitL&&p.x<20&&Math.abs(p.y-m.exitL.y)<64){if(G.seq===0){p.x=20;return;}loadSeq(G.seq-1,false);}
}

// ---------- save / load ----------
function save(){try{const p=G.player;localStorage.setItem('mageling_save',JSON.stringify({seq:G.seq,keys:G.keys,cleared:G.cleared,visited:G.visited,towersOpened:G.towersOpened,chestsOpened:G.chestsOpened,gold:G.gold,potions:G.potions,manaPots:G.manaPots,player:{hp:p.hp,mana:p.mana,lvl:p.lvl,xp:p.xp,skillPts:p.skillPts,skills:p.skills,equip:p.equip,bag:p.bag,age:p.age},story:G.story}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('mageling_save'));if(!d)return false;G.keys=d.keys||[];G.cleared=d.cleared||[];G.visited=d.visited||[0];G.towersOpened=d.towersOpened||[];G.chestsOpened=d.chestsOpened||{};G.gold=d.gold||0;G.potions=d.potions||0;G.manaPots=d.manaPots||0;G.story=d.story||[];G.player=newPlayer();Object.assign(G.player,d.player);const s=seqInfo(d.seq);loadSeq(s.kind==='town'?d.seq:d.seq-1,true);return true;}catch(e){return false;}}

// ---------- combat helpers ----------
function hurtPlayer(dmg){const p=G.player;if(p.invul>0||p.dead)return;const st=stats();const real=Math.max(1,Math.round(dmg-st.armor*2));p.hp-=real;p.invul=0.8;G.shake=6;sfx('hurt');addPart(p.x,p.y-10,'#ff5252',8,80,0.5,3);
  if(p.hp<=0){p.hp=0;p.dead=2.5;G.gold=Math.floor(G.gold*0.7);}}
function damageEnemy(e,dmg,src){if(e.dead)return;e.hp-=dmg;e.flash=0.12;addPart(e.x,e.y-8,e.col,4,60,0.4,3);
  if(e.hp<=0){e.dead=true;sfx('hit');addPart(e.x,e.y-8,e.col,16,120,0.7,4);killEnemy(e);}}
function killEnemy(e){const p=G.player,st=stats(),m=G.map;gainXp(e.xp);
  const gold=e.boss?60+m.idx*40:R()<0.6?ri(1,3+m.idx):0;if(gold)m.pickups.push({x:e.x,y:e.y,kind:'coin',n:gold,vx:rnd(-40,40),vy:-60,t:0});
  if(R()<0.12)m.pickups.push({x:e.x,y:e.y,kind:'heart',vx:rnd(-40,40),vy:-60,t:0});
  if(R()<0.10)m.pickups.push({x:e.x,y:e.y,kind:'mana',vx:rnd(-40,40),vy:-60,t:0});
  const dropP=0.035+st.luck*0.02+(e.boss?1:0);
  if(R()<dropP)m.pickups.push({x:e.x,y:e.y,kind:'item',item:rollItem(m.idx,e.boss?(R()<0.5?'legend':'epic'):null),vx:rnd(-30,30),vy:-80,t:0});
  if(e.boss){G.cleared[m.idx]=true;G.keys[m.idx]=true;m.gateOpen=true;for(const [x,y] of m.gateTiles){m.set(x,y,T_PATH);m.s[y*m.w+x]=0;}m.pickups.push({x:e.x,y:e.y+20,kind:'key',vx:0,vy:-90,t:0});G.shake=14;G.flash=1;
    const n=G.cleared.filter(Boolean).length;const newAge=n>=4?3:n>=2?2:n>=1?1:0;if(newAge>p.age){p.age=newAge;G.ageFx=3;sfx('level');}
    if(m.idx===BIOMES.length-1){setTimeout(()=>{G.screen='win';G.t=0;},2500);}
    save();}
}
function gainXp(n){const p=G.player;p.xp+=n;while(p.xp>=xpNeed(p.lvl)){p.xp-=xpNeed(p.lvl);p.lvl++;p.skillPts++;G.levelFx=2;sfx('level');const st=stats();p.hp=Math.min(st.maxHp,p.hp+st.maxHp*0.4);p.mana=st.maxMana;toast('star','#ffe57f');}}
function nearestEnemy(range){const p=G.player;let best=null,bd=range;for(const e of G.map.enemies){if(e.dead||e.state==='burrowed')continue;const d=dist(p.x,p.y,e.x,e.y);if(d<bd){bd=d;best=e;}}return best;}
function fireBolt(){const p=G.player,st=stats(),m=G.map;const e=nearestEnemy(280);if(!e)return;
  const a0=Math.atan2(e.y-p.y,e.x-p.x);p.aimA=a0;p.facing=Math.cos(a0)<0?-1:1;
  const spread=Math.max(1.5,22-st.aim*2)*Math.PI/180;
  const gem=p.equip.staff?p.equip.staff.gem:'#fff';
  for(let i=0;i<st.shots;i++){const a=a0+rnd(-spread,spread)+(i-(st.shots-1)/2)*0.08;m.projs.push({x:p.x+Math.cos(a)*14,y:p.y-12+Math.sin(a)*14,vx:Math.cos(a)*320,vy:Math.sin(a)*320,dmg:st.dmg*st.power,t:1.1,col:gem,pierce:st.pierce,slow:st.slow,hit:[]});}
  p.fireCd=st.rate;sfx('bolt');
}
const SPELLS={fire:{cost:18,cd:2.5,col:'#ff7043'},frost:{cost:22,cd:5,col:'#80d8ff'},heal:{cost:28,cd:7,col:'#69f0ae'},zap:{cost:20,cd:3.5,col:'#fff176'}};
function castSpell(id,forced){
  const p=G.player,st=stats(),m=G.map;if(G.screen!=='play'||p.dead)return;
  const sp=SPELLS[id];if(!forced){if(p.cds[id]>0){sfx('ui');return;}if(p.mana<sp.cost){toast('mana','#42a5f5');sfx('fizzle');return;}
    p.mana-=sp.cost;p.cds[id]=sp.cd;
    // reliability: focus skill
    const failP=Math.max(0.02,0.36-st.focus*0.032);
    if(R()<failP){const r=R();
      if(r<0.5){sfx('fizzle');addPart(p.x,p.y-20,'#9e9e9e',12,50,0.7,4);floatIcon(p.x,p.y-40,'fizzle','#bdbdbd');p.mana+=sp.cost*0.5;return;}
      if(r<0.8){const other=pick(Object.keys(SPELLS).filter(k=>k!==id));floatIcon(p.x,p.y-40,'shuffle','#ffab40');castSpell(other,true);return;}
      sfx('hurt');addPart(p.x,p.y-20,'#ff5252',14,90,0.6,4);floatIcon(p.x,p.y-40,'backfire','#ff5252');p.invul=0;hurtPlayer(6);return;}
  }
  p.castFx=0.35;p.cast=id;const pw=st.power*(forced?0.6:1);
  const a=p.aimA;
  if(id==='fire'){sfx('fire');for(let i=0;i<26;i++){const aa=a+rnd(-0.45,0.45),s=rnd(120,260);m.projs.push({x:p.x,y:p.y-10,vx:Math.cos(aa)*s,vy:Math.sin(aa)*s,dmg:9*pw,t:rnd(0.4,0.75),col:pick(['#ff7043','#ffab40','#ffee58']),flame:true,pierce:99,hit:[],burn:1});}}
  else if(id==='frost'){sfx('frost');m.parts.push({x:p.x,y:p.y-8,ring:true,t:0.8,life:0.8,col:'#80d8ff',r:0,sz:150});for(const e of m.enemies){if(e.dead)continue;if(dist(p.x,p.y,e.x,e.y)<150){e.frozen=Math.max(e.frozen,2.6*pw);damageEnemy(e,10*pw);}}addPart(p.x,p.y-8,'#e1f5fe',30,160,0.8,3);}
  else if(id==='heal'){sfx('heal');p.hp=Math.min(st.maxHp,p.hp+st.maxHp*0.32*pw);addPart(p.x,p.y-16,'#69f0ae',22,60,1,4,-60);for(let i=0;i<6;i++)m.parts.push({x:p.x+rnd(-14,14),y:p.y-rnd(0,30),vx:0,vy:-40,col:'#b9f6ca',t:1,life:1,sz:10,icon:'heart'});}
  else if(id==='zap'){sfx('zap');let from={x:p.x,y:p.y-12};let cur=null;const hit=[];for(let i=0;i<4;i++){let best=null,bd=220;for(const e of m.enemies){if(e.dead||hit.includes(e))continue;const d=dist(from.x,from.y,e.x,e.y);if(d<bd){bd=d;best=e;}}if(!best)break;hit.push(best);m.parts.push({bolt:true,x0:from.x,y0:from.y,x1:best.x,y1:best.y-8,t:0.25,life:0.25,col:'#fff176'});damageEnemy(best,22*pw*(1-i*0.15));from={x:best.x,y:best.y};}if(!hit.length){m.parts.push({bolt:true,x0:p.x,y0:p.y-12,x1:p.x+Math.cos(a)*120,y1:p.y-12+Math.sin(a)*120,t:0.2,life:0.2,col:'#fff176'});}}
}
function onKey(code){
  if(G.screen==='intro'){if(['Enter','Space','KeyJ'].includes(code))introNext();return;}
  if(G.screen==='win'||G.screen==='dead'){if(['Enter','Space','KeyJ'].includes(code)){G.screen='play';}return;}
  if(G.screen!=='play'){if(['Escape','Tab','KeyB','KeyI','KeyK','Enter'].includes(code)){closeScreen();}return;}
  if(code==='KeyJ')castSpell('fire');if(code==='KeyK')castSpell('frost');if(code==='KeyL')castSpell('heal');if(code==='KeyI')castSpell('zap');
  if(code==='Space'||code==='Digit1')castSpell('fire');if(code==='Digit2')castSpell('frost');if(code==='Digit3')castSpell('heal');if(code==='Digit4')castSpell('zap');
  if(code==='KeyB'||code==='Tab')openScreen('bag');if(code==='KeyU'||code==='KeyQ')openScreen('skill');if(code==='KeyM'||code==='KeyE')openScreen('map');
  if(code==='KeyH')usePotion('hp');if(code==='KeyN')usePotion('mana');
  if(code==='KeyR')G.rotTarget=G.rot+1; // debug turn
}
function usePotion(k){const p=G.player,st=stats();if(k==='hp'&&G.potions>0){G.potions--;p.hp=Math.min(st.maxHp,p.hp+st.maxHp*0.5);sfx('heal');addPart(p.x,p.y-16,'#ff8a80',16,60,0.8,3,-40);}
  if(k==='mana'&&G.manaPots>0){G.manaPots--;p.mana=Math.min(st.maxMana,p.mana+st.maxMana*0.6);sfx('pickup');addPart(p.x,p.y-16,'#82b1ff',16,60,0.8,3,-40);}}
function openScreen(s){sfx('ui');G.screen=s;G.uiT=0;stick.active=false;stick.dx=stick.dy=stick.mag=0;}
function closeScreen(){sfx('ui');G.screen='play';G.shop=null;}
function equipItem(idx){const p=G.player;const it=p.bag[idx];if(!it)return;const old=p.equip[it.slot];p.equip[it.slot]=it;p.bag.splice(idx,1);if(old)p.bag.push(old);sfx('pickup');const st=stats();p.hp=Math.min(p.hp,st.maxHp);save();}
function pickupItem(item){const p=G.player;if(p.bag.length>=12){G.map.pickups.push({x:p.x,y:p.y,kind:'item',item,vx:0,vy:0,t:1.5});toast('bag','#ffab40');return;}p.bag.push(item);sfx('level');toast(item.slot,RARITY[item.r].c);G.flash=0.4;save();}
function introNext(){G.introStep++;sfx('ui');if(G.introStep>=INTRO.length){G.screen='play';if(!G.map){G.player=newPlayer();loadSeq(0,true);}}}
const INTRO=['kid','gift','shadow','map','go'];
function startGame(){G.player=newPlayer();loadSeq(0,true);}

//  UPDATE
// ============================================================
function update(dt){
  G.t+=dt;if(G.travelAnim>0)G.travelAnim-=dt*1.2;if(G.flash>0)G.flash-=dt*2;if(G.levelFx>0)G.levelFx-=dt;if(G.ageFx>0)G.ageFx-=dt;if(G.bossBanner>0)G.bossBanner-=dt;if(G.touchHint>0)G.touchHint-=dt;
  for(const ms of G.msg)ms.t-=dt;G.msg=G.msg.filter(x=>x.t>0);
  if(G.screen==='intro'){return;}
  if(!G.map)return;
  const p=G.player,m=G.map,st=stats();
  // rotation animation
  if(G.rot!==G.rotTarget){G.rotAnim+=dt*2.2;if(G.rotAnim>=1){G.rot=((G.rotTarget%4)+4)%4;G.rotTarget=G.rot;G.rotAnim=0;}}
  if(G.screen!=='play'){updateAmbient(dt,true);return;}
  if(p.dead>0){p.dead-=dt;if(p.dead<=0){p.dead=0;p.hp=st.maxHp*0.6;p.mana=st.maxMana;p.x=m.spawn.x;p.y=m.spawn.y;p.invul=2;G.rot=G.rotTarget=0;for(const e of m.enemies)if(!e.dead){e.x=e.hx;e.y=e.hy;e.state='idle';}}updateAmbient(dt,true);return;}
  // ---- player movement (screen-relative, rotated into world) ----
  const mv=moveVector();const ang=-(G.rot+(G.rotTarget-G.rot)*G.rotAnim)*Math.PI/2;
  const ca=Math.cos(ang),sa=Math.sin(ang);
  const wx=mv.dx*ca-mv.dy*sa,wy=mv.dx*sa+mv.dy*ca;
  const spd=150*st.speed*(G.map.kind==='town'?1.05:1);
  const acc=mv.m>0?14:10;p.vx=lerp(p.vx,wx*spd,Math.min(1,acc*dt));p.vy=lerp(p.vy,wy*spd,Math.min(1,acc*dt));
  p.moving=Math.hypot(p.vx,p.vy)>12;if(p.moving){p.walk+=dt*Math.hypot(p.vx,p.vy)/22;if(Math.abs(p.vx)>10)p.facing=p.vx<0?-1:1;if(!nearestEnemy(280))p.aimA=Math.atan2(p.vy,p.vx);}
  moveCircle(p,p.vx*dt,p.vy*dt,8);
  p.x=clamp(p.x,6,m.w*TILE-6);p.y=clamp(p.y,6,m.h*TILE-6);
  // arch tiles -> rotate view
  if(G.archCool>0)G.archCool-=dt;
  {const tx=Math.floor(p.x/TILE),ty=Math.floor(p.y/TILE);const key=tx+','+ty;if(m.gt(tx,ty)===T_ARCH){if(G.lastArch!==key&&G.rot===G.rotTarget){G.lastArch=key;G.rotTarget=G.rot+1;sfx('turn');addPart(p.x,p.y-10,'#ff6fd8',24,140,0.9,4);}}else G.lastArch=null;}
  tryExit();
  // ---- regen, cooldowns ----
  if(p.invul>0)p.invul-=dt;for(const k in p.cds)if(p.cds[k]>0)p.cds[k]-=dt;if(p.castFx>0)p.castFx-=dt;
  p.regenT+=dt;if(p.regenT>1){p.regenT=0;p.hp=Math.min(st.maxHp,p.hp+0.5+st.regen*2+p.lvl*0.1);p.mana=Math.min(st.maxMana,p.mana+2+st.manaRegen*2+st.focus*0.3);}
  // ---- auto fire ----
  if(p.fireCd>0)p.fireCd-=dt;else fireBolt();
  // ---- projectiles ----
  for(const pr of m.projs){pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;pr.t-=dt;
    if(pr.enemy){if(dist(pr.x,pr.y,p.x,p.y-8)<pr.r+9){hurtPlayer(pr.dmg);pr.t=0;}if(m.solid(Math.floor(pr.x/TILE),Math.floor(pr.y/TILE),G.rot))pr.t=0;continue;}
    const tx=Math.floor(pr.x/TILE),ty=Math.floor(pr.y/TILE);if(!pr.flame&&m.solid(tx,ty,G.rot)&&m.gt(tx,ty)!==T_WATER){pr.t=0;addPart(pr.x,pr.y,pr.col,4,60,0.3,2);}
    for(const e of m.enemies){if(e.dead||pr.hit.includes(e)||e.state==='burrowed')continue;if(dist(pr.x,pr.y,e.x,e.y-6)<e.r+4){pr.hit.push(e);damageEnemy(e,pr.dmg);if(pr.burn)e.burn=Math.max(e.burn,2);if(pr.slow)e.frozen=Math.max(e.frozen,0.4);if(pr.pierce>0)pr.pierce--;else pr.t=0;if(!pr.flame)sfx('hit');break;}}}
  m.projs=m.projs.filter(pr=>pr.t>0);
  // ---- enemies ----
  const dp=(e)=>dist(p.x,p.y,e.x,e.y);
  for(const e of m.enemies){if(e.dead)continue;e.t+=dt;if(e.flash>0)e.flash-=dt;
    if(e.burn>0){e.burn-=dt;if(R()<dt*4){damageEnemy(e,3*st.power);addPart(e.x,e.y-10,'#ff7043',2,30,0.4,3,-40);}}
    if(e.frozen>0){e.frozen-=dt;continue;}

function updateAmbient(dt,paused){const m=G.map;if(!m)return;

// circle vs tile collision with sliding; returns false if blocked
function moveCircle(o,dx,dy,r,ghost){const m=G.map;let ok=true;
  const test=(x,y)=>{if(ghost)return false;for(const [ox,oy] of [[-r,0],[r,0],[0,-r],[0,r],[-r*0.6,-r*0.6],[r*0.6,-r*0.6],[-r*0.6,r*0.6],[r*0.6,r*0.6]]){const tx=Math.floor((x+ox)/TILE),ty=Math.floor((y+oy)/TILE);if(m.solid(tx,ty,G.rot))return true;}return false;};
  if(!test(o.x+dx,o.y)){o.x+=dx;}else{ // corner nudge: slide toward the open side
    let nudged=false;if(Math.abs(dx)>0.01)for(const n of [6,-6,12,-12]){if(!test(o.x+dx,o.y+n)&&!test(o.x,o.y+n*0.5)){o.y+=Math.sign(n)*Math.min(Math.abs(n),Math.abs(dx)+2);o.x+=dx*0.5;nudged=true;break;}}if(!nudged)ok=false;}
  if(!test(o.x,o.y+dy)){o.y+=dy;}else{
    let nudged=false;if(Math.abs(dy)>0.01)for(const n of [6,-6,12,-12]){if(!test(o.x+n,o.y+dy)&&!test(o.x+n*0.5,o.y)){o.x+=Math.sign(n)*Math.min(Math.abs(n),Math.abs(dy)+2);o.y+=dy*0.5;nudged=true;break;}}if(!nudged)ok=false;}
  // unstuck if inside a solid (e.g. prism wall closed on you)
  if(test(o.x,o.y)&&!ghost){for(const [ox,oy] of [[-TILE,0],[TILE,0],[0,-TILE],[0,TILE],[-TILE,-TILE],[TILE,TILE],[TILE,-TILE],[-TILE,TILE]]){if(!test(o.x+ox,o.y+oy)){o.x+=ox*0.5;o.y+=oy*0.5;break;}}}
  return ok;}

function drawPlayer(sx,sy,alphaOverride){
  const p=G.player,age=AGES[p.age],s=age.scale*1.15;const st=stats();
  const hat=p.equip.hat,robe=p.equip.robe,staff=p.equip.staff,boots=p.equip.boots,charm=p.equip.charm;
  const hc=hat?hat.col:'#7b6fd6',hs=hat?hat.star:'#ffe66d',rc=robe?robe.col:'#8e6cd6',sc=staff?staff.col:'#8d6e63',gc=staff?staff.gem:'#a5d6a7',bc=boots?boots.col:'#5d4037';
  const walk=p.moving?Math.sin(p.walk):0,walk2=p.moving?Math.sin(p.walk+Math.PI):0;const bob=p.moving?Math.abs(Math.sin(p.walk))*2:Math.sin(G.t*2.4)*1;
  ctx.save();ctx.translate(sx,sy);ctx.scale(s*p.facing,s);

  // robe (trapezoid, sways)

  ctx.fillStyle=rc;ctx.beginPath();ctx.moveTo(-7,-30);ctx.lineTo(7,-30);ctx.lineTo(14+sway,-6);ctx.lineTo(-14+sway,-6);ctx.closePath();ctx.fill();
  ctx.fillStyle=shade(rc,-0.3);ctx.fillRect(-1.5,-30,3,24);ctx.fillStyle=shade(rc,0.3);ctx.fillRect(-14+sway,-8,28,2);
  if(robe&&(robe.r==='epic'||robe.r==='legend')){ctx.fillStyle=RARITY[robe.r].c;for(let i=0;i<4;i++)circ(-6+i*4,-14+(i%2)*6,1.5),ctx.fill();}

  // head

  ctx.fillStyle='#222';circ(3,-39,1.4);ctx.fill();circ(-2,-39,1.4);ctx.fill();
  ctx.strokeStyle='#c97b63';ctx.lineWidth=1;ctx.beginPath();ctx.arc(1,-35,2.5,0.2,Math.PI-0.2);ctx.stroke();
  if(age.beard>0){ctx.fillStyle=age.beard>0.7?'#f5f5f5':'#8d6e63';ctx.beginPath();ctx.moveTo(-7,-36);ctx.quadraticCurveTo(-8,-26+age.beard*12,0,-24+age.beard*14);ctx.quadraticCurveTo(8,-26+age.beard*12,7,-36);ctx.closePath();ctx.fill();ctx.fillStyle='#ffdbac';ctx.beginPath();ctx.ellipse(1,-34,3,1.5,0,0,TAU);ctx.fill();}
  else{ctx.fillStyle='#8d6e63';ctx.beginPath();ctx.arc(0,-40,8.2,Math.PI,0);ctx.fill();}
  // hat
  const hh=age.hatH;const tipWob=Math.sin(G.t*3+p.walk)*3;
  ctx.fillStyle=shade(hc,-0.25);ctx.beginPath();ctx.ellipse(0,-44,15,4,0,0,TAU);ctx.fill();
  ctx.fillStyle=hc;ctx.beginPath();ctx.moveTo(-11,-44);ctx.lineTo(11,-44);ctx.quadraticCurveTo(6,-52*hh,3+tipWob,-66*hh);ctx.quadraticCurveTo(-2,-52*hh,-11,-44);ctx.closePath();ctx.fill();
  ctx.fillStyle=shade(hc,0.25);ctx.beginPath();ctx.moveTo(-11,-44);ctx.quadraticCurveTo(-4,-50*hh,3+tipWob,-66*hh);ctx.quadraticCurveTo(-6,-52*hh,-9,-45);ctx.closePath();ctx.fill();
  ctx.fillStyle=hs;ctx.save();ctx.translate(-1,-52*hh);ctx.rotate(G.t);ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?1.6:4,a=i*Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.restore();

  ctx.strokeStyle=sc;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(0,28);ctx.lineTo(0,-8);ctx.stroke();

  ctx.restore();

function drawEnemy(e,sx,sy){const t=e.t,c=e.col,r=e.r;ctx.save();ctx.translate(sx,sy);

    case 'ghost':case 'shade':{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-r,-6-b);ctx.lineTo(-r,-r*1.6-b);ctx.arc(0,-r*1.6-b,r,Math.PI,0);ctx.lineTo(r,-6-b);for(let i=0;i<4;i++)ctx.lineTo(r-(i+0.5)*r/2,-2-b+(i%2?-4:0));ctx.closePath();ctx.fill();ctx.fillStyle=e.type==='shade'?'#ff1744':'#263238';circ(-r*0.35,-r*1.6-b,r*0.18);ctx.fill();circ(r*0.35,-r*1.6-b,r*0.18);ctx.fill();break;}
    case 'yeti':case 'golem':{ctx.fillStyle=col;rr(-r*0.9,-r*2,r*1.8,r*1.7,r*0.5);ctx.fill();circ(0,-r*2.1,r*0.6);ctx.fill();ctx.fillStyle=shade(col,-0.35);const lg=Math.sin(t*5)*3;rr(-r*1.4,-r*1.7,r*0.5,r*1.3+lg*0.2,3);ctx.fill();rr(r*0.9,-r*1.7,r*0.5,r*1.3-lg*0.2,3);ctx.fill();ctx.fillRect(-r*0.7,-r*0.4,r*0.5,r*0.4);ctx.fillRect(r*0.2,-r*0.4,r*0.5,r*0.4);ctx.fillStyle=e.type==='golem'?'#ff9100':'#42a5f5';circ(-r*0.2,-r*2.2,r*0.12);ctx.fill();circ(r*0.2,-r*2.2,r*0.12);ctx.fill();break;}
    case 'scorpion':{ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-7,r,r*0.5,0,0,TAU);ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-r,-8);ctx.quadraticCurveTo(-r*1.6,-24,-r*0.8,-26+b);ctx.stroke();circ(-r*0.8,-26+b,3);ctx.fill();ctx.beginPath();ctx.moveTo(r*0.8,-8);ctx.lineTo(r*1.6,-14);ctx.moveTo(r*0.8,-6);ctx.lineTo(r*1.6,-2);ctx.stroke();for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-r*0.4+i*r*0.4,-6);ctx.lineTo(-r*0.4+i*r*0.4+Math.sin(t*10+i)*2,0);ctx.stroke();}break;}

    case 'djinn':{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-r*1.2,-r*1.2-b,-r*0.8,-r*2-b);ctx.arc(0,-r*2-b,r*0.8,Math.PI,0);ctx.quadraticCurveTo(r*1.2,-r*1.2-b,0,0);ctx.fill();ctx.fillStyle='#ffd54f';rr(-r*0.9,-r*2.9-b,r*1.8,4,2);ctx.fill();ctx.fillStyle='#fff';circ(-r*0.3,-r*2.1-b,2);ctx.fill();circ(r*0.3,-r*2.1-b,2);ctx.fill();break;}
    case 'eye':{ctx.fillStyle=col;circ(0,-r-b,r);ctx.fill();ctx.fillStyle='#fff';circ(0,-r-b,r*0.62);ctx.fill();ctx.fillStyle='#212121';circ(Math.cos(t)*3,-r-b,r*0.3);ctx.fill();for(let i=0;i<6;i++){const a=i/6*TAU+t;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(Math.cos(a)*r,-r-b+Math.sin(a)*r);ctx.lineTo(Math.cos(a)*r*1.5,-r-b+Math.sin(a)*r*1.5);ctx.stroke();}break;}

      else if(e.type==='frostwyrm'){ctx.fillStyle=col;for(let i=0;i<6;i++){circ(-i*r*0.4,-r*1.2-Math.sin(t*3+i*0.8)*10,r*(0.9-i*0.1));ctx.fill();}circ(r*0.4,-r*1.6,r*0.7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(r*0.6,-r*2.3);ctx.lineTo(r*0.8,-r*3.2);ctx.lineTo(r,-r*2.2);ctx.fill();ctx.fillStyle=ph?'#ff1744':'#e1f5fe';circ(r*0.7,-r*1.7,4);ctx.fill();}

function camAngle(){return (G.rot+(G.rotTarget-G.rot)*G.rotAnim)*Math.PI/2;}
function w2s(wx,wy){const th=camAngle(),c=Math.cos(th),s=Math.sin(th);const dx=wx-G.cam.x,dy=wy-G.cam.y;return{x:W/2+dx*c-dy*s,y:H/2+(PORTRAIT?-40:0)+dx*s+dy*c};}

  for(const c of m.chests){const s=w2s(c.x,c.y+12);if(!vis(s.x,s.y))continue;list.push({y:s.y,f:()=>{ctx.drawImage(SPR['chest'+(c.open?1:0)],s.x-16,s.y-30);if(!c.open){ctx.fillStyle=`rgba(255,235,130,${0.3+Math.sin(G.t*5)*0.2})`;circ(s.x,s.y-16,20);ctx.fill();}}});}
  for(const c of m.cats){const s=w2s(c.x,c.y+8);if(!vis(s.x,s.y))continue;list.push({y:s.y,f:()=>{const sp=SPR['cat'+c.v+'_'+c.f];ctx.save();ctx.translate(s.x,s.y);ctx.scale(c.dir,1);ctx.drawImage(sp,-16,-26);ctx.restore();if(c.state==='sit'&&Math.sin(c.t*0.7)>0.9){drawIcon('heart',s.x,s.y-36,10);}}});}

  const ph=G.screen==='map'?260:Math.min(H-40,520),py=(H-ph)/2;
  panel(px,py,pw,ph);closeBtn(px+pw-16,py+16);
  if(G.screen==='bag'){
    drawIcon('bag',px+34,py+30,30,'#6d4c41');
    // equipped slots
    const sw=pw/5;for(let i=0;i<5;i++){const sl=SLOTS[i],it=p.equip[sl],x=px+sw*i+sw/2,y=py+90;ctx.fillStyle='#e0d3b8';circ(x,y,30);ctx.fill();if(it){ctx.strokeStyle=RARITY[it.r].c;ctx.lineWidth=4;circ(x,y,30);ctx.stroke();drawItemIcon(it,x,y,40);}else drawIcon(sl,x,y,30,'#b0a58f');}
    ctx.fillStyle='#8d6e63';ctx.fillRect(px+20,py+135,pw-40,3);
    // stats strip
    const st=stats();const stt=[['heart',Math.round(st.maxHp)],['mana',Math.round(st.maxMana)],['aim',Math.round(st.dmg*st.power)],['swift',(st.speed).toFixed(1)]];stt.forEach((s,i)=>{const x=px+30+i*(pw-40)/4;drawIcon(s[0],x,py+155,20);num(s[1],x+16,py+156,14,'#3e2723');});
    // bag grid
    const cols=4,cs=Math.min(80,(pw-40)/cols);for(let i=0;i<12;i++){const x=px+20+(i%cols)*cs+cs/2,y=py+200+Math.floor(i/cols)*cs+cs/2;ctx.fillStyle='#e8dcc4';rr(x-cs/2+4,y-cs/2+4,cs-8,cs-8,10);ctx.fill();const it=p.bag[i];if(it){ctx.strokeStyle=RARITY[it.r].c;ctx.lineWidth=3;rr(x-cs/2+4,y-cs/2+4,cs-8,cs-8,10);ctx.stroke();drawItemIcon(it,x,y-6,cs*0.5);
      // compare arrow vs equipped
      const cur=p.equip[it.slot];const score=it=>(it.hp||0)+(it.mana||0)*0.6+(it.dmg||0)*4+(it.power||0)*6+(it.armor||0)*8+(it.speed||0)*30+(it.focus||0)*6+(it.aim||0)*6+(it.regen||0)*8+(it.manaRegen||0)*6+(it.luck||0)*6+((it.shots||1)-1)*10+(it.pierce||0)*8;
      const better=!cur||score(it)>score(cur);ctx.save();ctx.translate(x+cs/2-16,y+cs/2-16);ctx.rotate(better?-Math.PI/2:Math.PI/2);drawIcon('arrow',0,0,14,better?'#43a047':'#ef5350');ctx.restore();uiHit.push({x,y,r:cs/2,f:()=>equipItem(i)});}}
    // potions
    const yb=py+ph-44;drawIcon('potion',px+50,yb,30,G.potions?'#ff5252':'#999');num(G.potions,px+72,yb,16,'#3e2723');uiHit.push({x:px+55,y:yb,r:30,f:()=>usePotion('hp')});
    drawIcon('potion',px+140,yb,30,G.manaPots?'#42a5f5':'#999');num(G.manaPots,px+162,yb,16,'#3e2723');uiHit.push({x:px+145,y:yb,r:30,f:()=>usePotion('mana')});
    drawIcon('coin',px+pw-90,yb,24);num(G.gold,px+pw-72,yb,16,'#3e2723');
  }
  else if(G.screen==='skill'){
    drawIcon('arcana',px+34,py+30,30,'#7e57c2');drawIcon('star',px+pw/2,py+30,26,'#ffe57f');num(p.skillPts,px+pw/2+20,py+31,18,'#3e2723');
    const rows=[['aim','#ff8a65'],['focus','#ce93d8'],['vigor','#ff5c8a'],['arcana','#82b1ff'],['swift','#b2ff59']];const st=stats();
    rows.forEach((r,i)=>{const y=py+90+i*68;const v=p.skills[r[0]];ctx.fillStyle='#efe6d2';rr(px+16,y-26,pw-32,56,14);ctx.fill();drawIcon(r[0],px+44,y,34,r[1]);
      for(let k=0;k<10;k++){ctx.fillStyle=k<v?r[1]:'#cbbfa6';rr(px+76+k*((pw-190)/10),y-8,(pw-190)/10-5,16,4);ctx.fill();}
      const canAdd=p.skillPts>0&&v<10;circBtn(px+pw-46,y,20,canAdd?'#43a047':'#9e9e9e','plus','#fff',18);if(canAdd)uiHit.push({x:px+pw-46,y,r:26,f:()=>{p.skills[r[0]]++;p.skillPts--;sfx('level');save();}});
      // live effect preview icon
      const eff={aim:Math.max(2,22-st.aim*2)+'°',focus:Math.round(Math.max(2,36-st.focus*3.2))+'%',vigor:Math.round(st.maxHp),arcana:Math.round(st.maxMana),swift:st.speed.toFixed(2)}[r[0]];num(eff,px+pw-80,y+18,11,'#6d4c41','right');});
  }
  else if(G.screen==='map'){
    drawIcon('book',px+34,py+30,30,'#8d6e63');
    const n=TOWNS.length,gap=(pw-60)/(n-1);const cur=seqInfo(G.seq);
    for(let i=0;i<n;i++){const x=px+30+i*gap,y=py+120;
      if(i<n-1){ctx.strokeStyle=G.cleared[i]?'#43a047':'#bcaaa4';ctx.lineWidth=4;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(x+20,y);ctx.lineTo(x+gap-20,y);ctx.stroke();ctx.setLineDash([]);
        const bx=x+gap/2;drawIcon(G.cleared[i]?'check':'skull',bx,y-24,18,G.cleared[i]?'#43a047':'#7e57c2');if(cur.kind==='biome'&&cur.idx===i)drawIcon('star',bx,y+22,16,'#ffe57f');}
      const visited=G.visited.includes(i);ctx.fillStyle=visited?TOWNS[i].roof[0]:'#bdbdbd';circ(x,y,20);ctx.fill();ctx.strokeStyle=cur.kind==='town'&&cur.idx===i?'#ffd54f':'#5d4037';ctx.lineWidth=cur.kind==='town'&&cur.idx===i?5:2;circ(x,y,20);ctx.stroke();
      drawIcon(visited?'tower':'lock',x,y,20,visited?'#fff':'#757575');
      if(G.towersOpened[i])drawIcon('star',x+14,y-14,12,'#ffe57f');else if(G.keys[i]&&visited)drawIcon('key',x+14,y-14,12,'#ffd54f');
      if(visited&&!(cur.kind==='town'&&cur.idx===i))uiHit.push({x,y,r:30,f:()=>{closeScreen();loadSeq(i*2,true);}});}
    drawIcon('hand',px+pw/2-30,py+200,22,'#8d6e63');drawIcon('arrow',px+pw/2+10,py+200,18,'#8d6e63');drawIcon('tower',px+pw/2+44,py+200,20,'#43a047');
  }
  else if(G.screen==='shop'&&G.shop){
    drawIcon('shop',px+34,py+30,30,'#6d4c41');drawIcon('coin',px+pw/2,py+30,22);num(G.gold,px+pw/2+18,py+31,16,'#3e2723');
    G.shop.stock.forEach((s,i)=>{const y=py+110+i*120;ctx.fillStyle=s.sold?'#d7ccc8':'#efe6d2';rr(px+20,y-48,pw-40,100,16);ctx.fill();
      if(s.kind==='potion')drawIcon('potion',px+70,y,50,'#ff5252');else if(s.kind==='mana')drawIcon('potion',px+70,y,50,'#42a5f5');else{ctx.fillStyle='#fff';circ(px+70,y,30);ctx.fill();ctx.strokeStyle=RARITY[s.item.r].c;ctx.lineWidth=4;circ(px+70,y,30);ctx.stroke();drawItemIcon(s.item,px+70,y,40);}
      drawIcon('coin',px+pw-120,y,26);num(s.price,px+pw-102,y+1,18,G.gold>=s.price?'#3e2723':'#c62828');
      if(!s.sold){const ok=G.gold>=s.price;circBtn(px+pw-46,y,22,ok?'#43a047':'#9e9e9e','check','#fff',20);if(ok)uiHit.push({x:px+pw-46,y,r:30,f:()=>{G.gold-=s.price;sfx('pickup');if(s.kind==='potion')G.potions++;else if(s.kind==='mana')G.manaPots++;else{s.sold=true;pickupItem(s.item);}save();}});}
      else drawIcon('check',px+pw-46,y,22,'#9e9e9e');});
  }
}
function drawIntro(){
  ctx.fillStyle='#2a1a4a';ctx.fillRect(0,0,W,H);for(let i=0;i<60;i++){const x=(i*97)%W,y=(i*131+G.t*10*(i%3+1))%H;ctx.fillStyle=`rgba(255,255,255,${0.3+(i%5)*0.12})`;circ(x,y,1+(i%3));ctx.fill();}
  const pw=Math.min(W-30,420),ph=Math.min(H-120,360),px=(W-pw)/2,py=(H-ph)/2-30;
  ctx.fillStyle='#fdf6e3';rr(px,py,pw,ph,24);ctx.fill();ctx.strokeStyle='#ffd54f';ctx.lineWidth=5;rr(px,py,pw,ph,24);ctx.stroke();uiHit=[];
  const cx=px+pw/2,cy=py+ph/2;const step=INTRO[G.introStep]||'go';
  if(!G.player){G.player=newPlayer();}
  // ground hill
  ctx.fillStyle='#8bc34a';ctx.beginPath();ctx.ellipse(cx,py+ph-20,pw*0.6,60,0,Math.PI,0);ctx.fill();
  if(step==='kid'){ctx.save();ctx.translate(cx-30,cy+70);ctx.scale(1.6,1.6);const ag=G.player.age;G.player.age=0;drawPlayer(0,0,1);G.player.age=ag;ctx.restore();ctx.drawImage(SPR['cat0_0'],cx+30,cy+30);drawIcon('sun',cx+110,cy-90,60);drawIcon('heart',cx+40,cy-10+Math.sin(G.t*3)*4,20);
    const hasSave=(()=>{try{return !!localStorage.getItem('mageling_save');}catch(e){return false;}})();
    if(hasSave){circBtn(cx-60,py+ph-50,26,'#43a047','arrow','#fff',24);uiHit.push({x:cx-60,y:py+ph-50,r:34,f:()=>{if(load()){G.screen='play';sfx('door');}}});circBtn(cx+60,py+ph-50,26,'#ef5350','star','#fff',24);uiHit.push({x:cx+60,y:py+ph-50,r:34,f:()=>{try{localStorage.removeItem('mageling_save');}catch(e){}G.introStep=1;sfx('ui');}});}
    else{uiHit.push({x:cx,y:cy,r:9999,f:introNext});}}
  else if(step==='gift'){ctx.save();ctx.translate(cx-90,cy+70);ctx.scale(1.5,1.5);const ag=G.player.age;G.player.age=3;const f=G.player.facing;G.player.facing=1;drawPlayer(0,0,1);G.player.age=ag;G.player.facing=f;ctx.restore();ctx.save();ctx.translate(cx+90,cy+70);ctx.scale(1.4,1.4);const ag2=G.player.age;G.player.age=0;G.player.facing=-1;drawPlayer(0,0,1);G.player.age=ag2;G.player.facing=1;ctx.restore();drawItemIcon({slot:'staff',col:'#8d6e63',gem:'#a5d6a7'},cx-10,cy-30+Math.sin(G.t*3)*4,34);drawIcon('arrow',cx+30,cy-30,26,'#5d4037');uiHit.push({x:cx,y:cy,r:9999,f:introNext});}
  else if(step==='shadow'){drawIcon('sun',cx-60,cy-60,70);drawIcon('shadow',cx+70,cy-50+Math.sin(G.t*2)*6,80);drawIcon('hand',cx+20,cy-60,30,'#1a1140');ctx.fillStyle='rgba(26,17,64,0.5)';ctx.fillRect(px,py,pw,ph*0.4);drawIcon('arrowL',cx+15,cy-20,24,'#1a1140');ctx.save();ctx.translate(cx-40,cy+80);ctx.scale(1.4,1.4);const ag=G.player.age;G.player.age=0;drawPlayer(0,0,1);G.player.age=ag;ctx.restore();drawIcon('backfire',cx-40,cy-10,20,'#ff5252');uiHit.push({x:cx,y:cy,r:9999,f:introNext});}
  else if(step==='map'){const n=TOWNS.length;for(let i=0;i<n;i++){const x=px+50+i*(pw-100)/(n-1),y=cy+Math.sin(i*1.3)*40;if(i<n-1){ctx.strokeStyle='#8d6e63';ctx.lineWidth=4;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(px+50+(i+1)*(pw-100)/(n-1),cy+Math.sin((i+1)*1.3)*40);ctx.stroke();ctx.setLineDash([]);}ctx.fillStyle=TOWNS[i].roof[0];circ(x,y,18);ctx.fill();drawIcon('tower',x,y,18,'#fff');}drawIcon('shadow',px+pw-50,cy+Math.sin(4*1.3)*40-50,44);drawIcon('sun',px+pw-50,cy+Math.sin(4*1.3)*40-100,30);ctx.save();ctx.translate(px+50,cy+40);ctx.scale(0.9,0.9);const ag=G.player.age;G.player.age=0;drawPlayer(0,0,1);G.player.age=ag;ctx.restore();uiHit.push({x:cx,y:cy,r:9999,f:introNext});}
  else{ // go: control legend
    const sb=UI.stickBase;drawIcon('hand',cx-100,cy-40,40,'#5d4037');ctx.strokeStyle='#5d4037';ctx.lineWidth=3;circ(cx-100,cy-40,40);ctx.stroke();for(let i=0;i<4;i++){const a=i*Math.PI/2;drawIcon('arrow',cx-100+Math.cos(a)*58,cy-40+Math.sin(a)*58,14,'#5d4037');}
    ['fire','frost','heal','zap'].forEach((s,i)=>{const b=UI.btns[i];const g=36;const ox=cx+90+(i===0?g:i===2?-g:0),oy=cy-40+(i===1?g:i===3?-g:0);circBtn(ox,oy,18,shade(SPELLS[s].col,-0.35),s,SPELLS[s].col,20);});
    drawIcon('aim',cx-100,cy+80,30,'#ff8a65');drawIcon('arrow',cx-50,cy+80,20,'#5d4037');drawIcon('skull',cx,cy+80,28,'#7e57c2');drawIcon('turn',cx+80,cy+80,30);
    circBtn(cx,py+ph-50,30,'#43a047','arrow','#fff',28);uiHit.push({x:cx,y:cy,r:9999,f:introNext});}
  // progress dots
  for(let i=0;i<INTRO.length;i++){ctx.fillStyle=i===G.introStep?'#ffd54f':'rgba(255,255,255,0.4)';circ(W/2-40+i*20,py+ph+30,5);ctx.fill();}
  // title mark: hat icon large
  drawItemIcon({slot:'hat',col:'#7b6fd6',star:'#ffe66d'},W/2,py-40,64);
}
function uiTap(x,y){if(G.screen==='dead')return true;for(const h of uiHit){if(dist(x,y,h.x,h.y)<h.r){h.f();return true;}}return true;}
function drawDead(){ctx.fillStyle='rgba(40,0,20,0.5)';ctx.fillRect(0,0,W,H);drawIcon('skull',W/2,H/2-40,70);drawIcon('coin',W/2-30,H/2+30,24);drawIcon('arrow',W/2+10,H/2+30,18,'#ff5252');num('-30%',W/2+50,H/2+30,16,'#ff8a80');}

// ============================================================
//  MAIN LOOP
// ============================================================
let last=0;
function frame(ts){const dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
  try{update(dt);}catch(e){console.error(e);}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  if(G.screen==='intro'){drawIntro();}
  else if(G.map){drawWorld();drawHUD();if(G.player.dead>0)drawDead();if(G.screen!=='play')drawScreen();}
  requestAnimationFrame(frame);}
function init(){resize();buildSprites();requestAnimationFrame(frame);}
init();
</script>
</body>

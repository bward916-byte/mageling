const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1,PORTRAIT=false,S=1,VW=0,VH=0; // S = world->screen scale, VW/VH = view size in world units
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  PORTRAIT=H>W;
  S=PORTRAIT?W/270:H/380;
  VW=W/S;VH=H/S;
  layoutUI();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));

// ---------- utils ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const TAU=Math.PI*2;
function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let R=Math.random;
const rnd=(a,b)=>a+R()*(b-a);
const ri=(a,b)=>Math.floor(a+R()*(b-a+1));
const pick=arr=>arr[Math.floor(R()*arr.length)];
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=v=>clamp(Math.round(amt>0?v+(255-v)*amt:v*(1+amt)),0,255);return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.closePath();}
function txt(s,x,y,size,color,align,weight){ctx.font=(weight||'700')+' '+size+'px "Trebuchet MS",Verdana,sans-serif';ctx.fillStyle=color||'#e8dccb';ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function otxt(s,x,y,size,color,align){ctx.font='700 '+size+'px "Trebuchet MS",Verdana,sans-serif';ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.lineWidth=Math.max(2,size*0.18);ctx.strokeStyle='#0a0508';ctx.lineJoin='round';ctx.strokeText(s,x,y);ctx.fillStyle=color||'#e8dccb';ctx.fillText(s,x,y);}
function wrap(s,maxW,size){ctx.font='700 '+size+'px "Trebuchet MS",Verdana,sans-serif';const words=s.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}

// palette — ember & ash
const C={bg:'#0a0508',ink:'#120609',bone:'#e8dccb',dim:'#8a7a70',red:'#c1121f',ember:'#ff5a1f',gold:'#e0a020',plum:'#3b1150',blood:'#5a0d14',ash:'#2b2226',mana:'#5b7cff',hp:'#e63946',xp:'#c9a227'};

// ---------- audio (tiny synth) ----------
let AC=null,masterGain=null;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();masterGain=AC.createGain();masterGain.gain.value=0.22;masterGain.connect(AC.destination);}catch(e){}}
function sfx(type){
  if(!AC)return;if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(masterGain);
  const env=(a,d,v)=>{g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);o.start(t);o.stop(t+a+d+0.02);};
  const f=(v,tt)=>o.frequency.setValueAtTime(v,t+(tt||0)),fe=(v,tt)=>o.frequency.exponentialRampToValueAtTime(v,t+tt);
  switch(type){
    case 'bolt':o.type='triangle';f(760);fe(200,0.12);env(0.005,0.12,0.45);break;
    case 'hit':o.type='square';f(150);fe(55,0.1);env(0.005,0.1,0.35);break;
    case 'fire':o.type='sawtooth';f(110);fe(35,0.35);env(0.01,0.35,0.55);break;
    case 'frost':o.type='sine';f(1300);fe(380,0.4);env(0.01,0.4,0.45);break;
    case 'zap':o.type='square';f(1900);fe(280,0.15);env(0.002,0.15,0.35);break;
    case 'heal':o.type='sine';f(440);o.frequency.linearRampToValueAtTime(880,t+0.3);env(0.02,0.35,0.45);break;
    case 'fizzle':o.type='sawtooth';f(280);o.frequency.linearRampToValueAtTime(80,t+0.3);env(0.02,0.3,0.3);break;
    case 'pickup':o.type='sine';f(660);f(990,0.07);f(1320,0.14);env(0.005,0.25,0.45);break;
    case 'level':o.type='triangle';f(523);f(659,0.1);f(784,0.2);f(1046,0.3);env(0.01,0.5,0.5);break;
    case 'meow':o.type='sine';f(700);o.frequency.linearRampToValueAtTime(1000,t+0.08);o.frequency.linearRampToValueAtTime(600,t+0.25);env(0.02,0.25,0.3);break;
    case 'hurt':o.type='sawtooth';f(190);fe(70,0.2);env(0.005,0.2,0.45);break;
    case 'jump':o.type='sine';f(300);fe(600,0.1);env(0.005,0.12,0.25);break;
    case 'door':o.type='triangle';f(220);f(330,0.12);f(440,0.24);env(0.01,0.4,0.45);break;
    case 'ui':o.type='sine';f(600);env(0.005,0.06,0.25);break;
  }
}

const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=1;audioInit();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();if(!e.repeat)onKey(e.code);});

const touches={}; // id -> btn id

const UI={btns:[],hud:[]};
function layoutUI(){
  const pad=16,br=PORTRAIT?32:30,mr=PORTRAIT?34:32;
  const by=H-pad-mr-8;
  UI.btns=[
    {id:'left',x:pad+mr,y:by,r:mr,hold:true,txt:'◀'},
    {id:'right',x:pad+mr*3.3,y:by,r:mr,hold:true,txt:'▶'},
    {id:'jump',x:pad+mr*2.15,y:by-mr*2.2,r:mr*0.95,hold:true,txt:'▲'},
  ];
  const cx=W-pad-br*2.6,cy=H-pad-br*2.6,g=br*1.55;
  UI.btns.push({id:'fire',x:cx+g,y:cy,r:br},{id:'frost',x:cx,y:cy+g,r:br},{id:'heal',x:cx-g,y:cy,r:br},{id:'zap',x:cx,y:cy-g,r:br});
  UI.hud=[{id:'bag',x:W-pad-24,y:pad+24,r:22,txt:'BAG'},{id:'skill',x:W-pad-24-54,y:pad+24,r:22,txt:'SKL'},{id:'pause',x:W-pad-24-108,y:pad+24,r:22,txt:'II'}];
}
function tPos(t){const r=canvas.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top};}
function btnAt(x,y){for(const b of UI.btns)if(dist(x,y,b.x,b.y)<b.r+8)return b;for(const b of UI.hud)if(dist(x,y,b.x,b.y)<b.r+6)return b;return null;}
function pressStart(id,x,y){
  if(G.screen!=='play'){uiTap(x,y);return 'ui';}
  if(G.dialog){G.dialog=null;return 'ui';}
  const b=btnAt(x,y);
  if(!b){ // tap on world: left half = walk toward tap side? no — tap right side of screen = jump helper
    return null;}
  if(b.hold){held[b.id]=1;return b.id;}
  if(b.id==='bag'||b.id==='skill')openScreen(b.id);else if(b.id==='pause')openScreen('pause');else castSpell(b.id);
  return 'ui';
}
canvas.addEventListener('touchstart',e=>{e.preventDefault();audioInit();for(const t of e.changedTouches){const p=tPos(t);const r=pressStart(t.identifier,p.x,p.y);touches[t.identifier]=r;}},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const r=touches[t.identifier];if(r==='left'||r==='right'){const p=tPos(t);const b=btnAt(p.x,p.y);const nid=b&&b.hold&&b.id!=='jump'?b.id:r;if(nid!==r){held[r]=0;held[nid]=1;touches[t.identifier]=nid;}}}},{passive:false});
function endTouch(e){e.preventDefault();for(const t of e.changedTouches){const r=touches[t.identifier];if(r&&held[r]!==undefined)held[r]=0;delete touches[t.identifier];}}
canvas.addEventListener('touchend',endTouch,{passive:false});canvas.addEventListener('touchcancel',endTouch,{passive:false});
let mouseBtn=null;
canvas.addEventListener('mousedown',e=>{audioInit();const p=tPos(e);mouseBtn=pressStart('m',p.x,p.y);});
window.addEventListener('mouseup',()=>{if(mouseBtn&&held[mouseBtn]!==undefined)held[mouseBtn]=0;mouseBtn=null;});
// gamepad
let gpOK=typeof navigator!=='undefined'&&!!navigator.getGamepads;const gpPrev={};
function pollGamepad(){
  if(!gpOK)return null;let gps;try{gps=navigator.getGamepads();}catch(e){gpOK=false;return null;}
  const gp=gps&&(gps[0]||gps[1]||gps[2]||gps[3]);if(!gp)return null;
  const ax=gp.axes[0]||0;const b=i=>gp.buttons[i]&&gp.buttons[i].pressed;
  const edge=(name,v)=>{const was=gpPrev[name];gpPrev[name]=v;return v&&!was;};
  if(edge('A',b(0)))onKey('Space');if(edge('B',b(1)))onKey('KeyK');if(edge('X',b(2)))onKey('KeyJ');if(edge('Y',b(3)))onKey('KeyI');
  if(edge('R',b(5)))onKey('KeyL');if(edge('L',b(4)))onKey('KeyH');if(edge('sel',b(8)))onKey('KeyB');if(edge('start',b(9)))onKey('Enter');
  let dx=Math.abs(ax)>0.2?ax:0;if(b(14))dx=-1;if(b(15))dx=1;
  return{dx,jump:b(0)};
}
function moveInput(){
  let dx=0,jump=false;
  if(keys.ArrowLeft||keys.KeyA)dx-=1;if(keys.ArrowRight||keys.KeyD)dx+=1;
  if(keys.ArrowUp||keys.KeyW||keys.Space)jump=true;
  if(held.left)dx-=1;if(held.right)dx+=1;if(held.jump)jump=true;
  const g=pollGamepad();if(g){dx+=g.dx;if(g.jump)jump=true;}
  return{dx:clamp(dx,-1,1),jump};
}

function rollItem(depth,minR){ // depth 0..4
  const w=[60,28-depth*3,10+depth*3,2+depth*2];let r=0;let tot=w.reduce((a,b)=>a+b,0);let x=R()*tot;for(let i=0;i<4;i++){x-=w[i];if(x<=0){r=i;break;}}
  r=Math.max(r,minR||0);const pool=ITEMS.filter(i=>i.r===r);return Object.assign({},pick(pool));
}

// ---------- level generation ----------
// level: {kind,idx,def,w,plats[{x,y,w,h}],ground y baseline, decor, npcs, enemies, chests, door, exitL, exitR, boss...}
function genTown(idx){
  R=mulberry(1000+idx*77);
  const def=TOWNS[idx],w=1500+idx*120,gy=300;
  const L={kind:'town',idx,def,w,gy,plats:[],decor:[],npcs:[],cats:[],enemies:[],projs:[],eprojs:[],pickups:[],chests:[],parts:[],spawn:{x:80,y:gy-40},exitL:idx>0?{x:0}:null,exitR:{x:w},time:0};
  L.plats.push({x:-200,y:gy,w:w+400,h:900,ground:true});
  // houses
  let x=140;const houses=[];
  while(x<w-260){const hw=ri(70,110),hh=ri(60,100);houses.push({x,y:gy-hh,w:hw,h:hh,v:ri(0,3),win:ri(1,3),chim:R()<0.6});x+=hw+ri(30,70);}
  L.houses=houses;
  // rooftop platforms & lanterns
  for(const h of houses){if(R()<0.5)L.plats.push({x:h.x-4,y:h.y-2,w:h.w+8,h:8,roof:true});}
  for(let i=0;i<houses.length-1;i++){const a=houses[i],b=houses[i+1];if(R()<0.5)L.plats.push({x:a.x+a.w+8,y:gy-ri(50,110),w:b.x-a.x-a.w-16,h:8});}
  for(let i=0;i<w;i+=ri(90,140))L.decor.push({t:'lamp',x:i+40,y:gy});
  for(let i=0;i<w;i+=ri(40,90))L.decor.push({t:pick(['grave','bush','stump','pot','barrel','fence','crate','crow']),x:i+20,y:gy,v:R()});
  // npcs
  const n=4+idx;const lines=def.lines.slice();
  for(let i=0;i<n;i++){const hx=houses[Math.min(houses.length-1,Math.floor(i*houses.length/n))];L.npcs.push({x:hx.x+hx.w/2+ri(-30,30),y:gy,line:lines[i%lines.length],c:pick(['#5a0d14','#3b1150','#2a3a4a','#4a3326','#1a1020']),hat:R()<0.5,w:14,h:30,talkCd:0});}
  // shop

    }}

function drawItemIcon(it,x,y,s){

const INK='#0a0508';
function ol(w){ctx.lineWidth=w||1.4;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.stroke();}
function grad(x0,y0,x1,y1,a,b){const g=ctx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function rgrad(x,y,r0,r1,a,b){const g=ctx.createRadialGradient(x,y,r0,x,y,r1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function shadow(x,y,w){ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(x,y,w,w*0.3,0,0,TAU);ctx.fill();}
function poly(pts){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();}

function drawDecor(d,L){

    for(let i=0;i<4;i++){const ly=y-h*0.3-i*h*0.17,lw=(38-i*8)*s,lh=24*s;ctx.fillStyle=grad(x-lw,0,x+lw,0,shade(tc,0.18),shade(tc,-0.35));poly([x-lw,ly,x-lw*0.5,ly-lh*0.35,x,ly-lh,x+lw*0.5,ly-lh*0.35,x+lw,ly]);ctx.fill();ol(1.2*s);

    ctx.strokeStyle=shade(tc,0.12);ctx.lineWidth=4.5*s;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+6*s,y-40*s,x+2*s,y-70*s);ctx.stroke();

    ctx.fillStyle=rgrad(x,y-48,2,42,`rgba(255,179,71,${0.22*fl})`,'rgba(255,179,71,0)');circ(x,y-48,42);ctx.fill();

  if(d.t==='ember'){const fl=0.6+0.4*Math.sin(G.time*5+x);ctx.fillStyle=rgrad(x,y-4,1,18*s,`rgba(255,90,31,${0.3*fl})`,'rgba(255,90,31,0)');circ(x,y-4,18*s);ctx.fill();ctx.fillStyle='#2a0d05';ctx.beginPath();ctx.ellipse(x,y-2,7*s,3*s,0,0,TAU);ctx.fill();ctx.fillStyle=`rgba(255,${120+60*fl},31,1)`;ctx.beginPath();ctx.ellipse(x,y-3,4*s,1.8*s,0,0,TAU);ctx.fill();ctx.fillStyle='#ffe66d';circ(x-1*s,y-3.5,1.2*s);ctx.fill();for(let i=0;i<2;i++){const t=(G.time*0.7+i*0.5+x*0.01)%1;ctx.fillStyle=`rgba(255,179,71,${0.7*(1-t)})`;circ(x+Math.sin(t*8+i)*4*s,y-4-t*30*s,1.2);ctx.fill();}return;}

  ctx.fillStyle=shade(def.wall,-0.5);ctx.fillRect(x,y+hh-14,w,14);ctx.fillStyle='rgba(255,255,255,0.05)';for(let i=0;i<w;i+=18)ctx.fillRect(x+i+((Math.floor((y+hh)/7))%2?9:0),y+hh-12,14,5);

  const ry=h.v===2?42:h.v===0?30:h.v===1?22:14;const rp=h.v===0?[x-10,y,x+w/2,y-ry,x+w+10,y]:h.v===1?[x-8,y,x+w*0.3,y-ry,x+w*0.7,y-ry,x+w+8,y]:h.v===2?[x-10,y,x+w*0.5,y-ry,x+w+10,y]:[x-8,y,x,y-ry,x+w,y-ry,x+w+8,y];

  ctx.fillStyle='rgba(0,0,0,0.28)';for(let r=0;r<ry;r+=6){for(let i=-12;i<w+24;i+=10)ctx.fillRect(x+i+((r/6)%2?5:0),y-ry+r,9,1.5);}

  // door
  const dx=x+w*0.5;ctx.fillStyle=INK;rr(dx-11,y+hh-29,22,29,6);ctx.fill();ctx.fillStyle=grad(0,y+hh-28,0,y+hh,'#3a2418','#1a0f0a');rr(dx-9,y+hh-27,18,27,5);ctx.fill();ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(dx-1,y+hh-27,2,27);ctx.fillStyle=C.gold;circ(dx+4,y+hh-13,1.6);ctx.fill();
  ctx.fillStyle='rgba(255,179,71,0.08)';ctx.beginPath();ctx.moveTo(dx-9,y+hh);ctx.lineTo(dx-20,y+hh+10);ctx.lineTo(dx+20,y+hh+10);ctx.lineTo(dx+9,y+hh);ctx.fill();
  // windows
  for(let i=0;i<h.win;i++){const wxp=h.win===1?x+w/2-6:x+10+i*(w-32)/(h.win-1);const gl=0.75+0.25*Math.sin(G.time*3+x+i*2);
    ctx.fillStyle=rgrad(wxp+6,y+22,2,22,`rgba(255,179,71,${0.2*gl})`,'rgba(255,179,71,0)');circ(wxp+6,y+22,22);ctx.fill();
    ctx.fillStyle=INK;rr(wxp-1.5,y+13,15,17,2);ctx.fill();ctx.fillStyle=grad(0,y+14,0,y+28,'#ffe3a0',def.light);rr(wxp,y+14,12,15,1.5);ctx.fill();

function v2rand(n){return Math.abs(Math.sin(n*12.9898)*43758.5453)%1;}
function drawTower(t,def,L){
  const x=t.x,y=t.y,h=200;shadow(x,y-1,32);

  // potions
  const px=W-pad-24-162;ctx.fillStyle='rgba(10,5,8,0.7)';rr(px-30,pad+8,56,32,8);ctx.fill();
  ctx.fillStyle=C.hp;rr(px-24,pad+16,8,12,3);ctx.fill();txt('x'+P.pots.hp+' (H)',px-13,pad+22,8,C.bone);
  ctx.fillStyle=C.mana;rr(px-24,pad+30,8,10,3);ctx.fill();txt('x'+P.pots.mp+' (M)',px-13,pad+35,8,C.bone);
  // move buttons
  for(const b of UI.btns){if(!b.hold)continue;ctx.fillStyle=held[b.id]?'rgba(193,18,31,0.45)':'rgba(10,5,8,0.5)';circ(b.x,b.y,b.r);ctx.fill();ctx.strokeStyle='rgba(232,220,203,0.35)';ctx.lineWidth=1.5;circ(b.x,b.y,b.r);ctx.stroke();ctx.fillStyle='rgba(232,220,203,0.85)';ctx.beginPath();const r=b.r*0.36;if(b.id==='left'){ctx.moveTo(b.x-r,b.y);ctx.lineTo(b.x+r*0.7,b.y-r);ctx.lineTo(b.x+r*0.7,b.y+r);}else if(b.id==='right'){ctx.moveTo(b.x+r,b.y);ctx.lineTo(b.x-r*0.7,b.y-r);ctx.lineTo(b.x-r*0.7,b.y+r);}else{ctx.moveTo(b.x,b.y-r);ctx.lineTo(b.x+r,b.y+r*0.7);ctx.lineTo(b.x-r,b.y+r*0.7);}ctx.closePath();ctx.fill();}
  // spell buttons
  for(const b of UI.btns){if(b.hold)continue;const sp=SPELLS[b.id];const cd=P.cds[b.id]/sp.cd,can=P.mana>=sp.cost;
    ctx.fillStyle='rgba(10,5,8,0.7)';circ(b.x,b.y,b.r);ctx.fill();ctx.fillStyle=sp.c;ctx.globalAlpha=can?0.85:0.3;circ(b.x,b.y,b.r-4);ctx.fill();ctx.globalAlpha=1;
    if(cd>0){ctx.fillStyle='rgba(10,5,8,0.7)';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.arc(b.x,b.y,b.r-4,-Math.PI/2,-Math.PI/2+TAU*cd);ctx.closePath();ctx.fill();}
    txt(sp.name,b.x,b.y-3,10,'#0a0508','center');txt(sp.cost+'mp',b.x,b.y+9,7,'#0a0508','center');
    txt(sp.key,b.x+b.r-6,b.y-b.r+8,8,C.bone,'center');}
  // boss bar
  const L=G.map;if(L.boss&&!L.boss.dead){const b=L.boss,bw=Math.min(360,W*0.6);bar(W/2-bw/2,H-pad-8,bw,10,b.hp/b.maxHp,C.red);txt(ENEMY[b.t].name,W/2,H-pad-20,11,C.bone,'center');}
  if(G.bossBanner>0){ctx.globalAlpha=Math.min(1,G.bossBanner);otxt(ENEMY[L.def.boss].name,W/2,H*0.32,PORTRAIT?22:30,C.red,'center');ctx.globalAlpha=1;}
  if(G.levelFx>0){ctx.globalAlpha=Math.min(1,G.levelFx);otxt('LEVEL UP',W/2,H*0.4,26,C.gold,'center');ctx.globalAlpha=1;}
  if(G.ageFx>0){ctx.globalAlpha=Math.min(1,G.ageFx/1.5);otxt('You have grown',W/2,H*0.46,24,C.bone,'center');ctx.globalAlpha=1;}
  // toasts
  let ty=pad+72;for(const t of G.toasts){ctx.globalAlpha=Math.min(1,t.t);ctx.fillStyle='rgba(10,5,8,0.75)';const w=ctx.measureText(t.s).width;ctx.font='700 11px "Trebuchet MS",Verdana,sans-serif';const tw=ctx.measureText(t.s).width+16;rr(pad-6,ty-8,Math.min(W-2*pad,tw),18,5);ctx.fill();txt(t.s,pad+2,ty+1,11,t.c);ty+=22;}ctx.globalAlpha=1;
  // dialog
  if(G.dialog){const d=G.dialog,bw=Math.min(W-2*pad,520),bx=W/2-bw/2,by=H*0.62-(PORTRAIT?60:0);ctx.fillStyle='rgba(10,5,8,0.9)';rr(bx,by,bw,64,10);ctx.fill();ctx.strokeStyle='#c1121f';ctx.lineWidth=2;rr(bx,by,bw,64,10);ctx.stroke();
    let yy=by+14;if(d.who){txt(d.who,bx+12,yy,10,C.gold);yy+=14;}const lines=wrap(d.line,bw-24,12);for(const l of lines.slice(0,3)){txt(l,bx+12,yy,12,C.bone);yy+=15;}txt('tap to close',bx+bw-12,by+56,8,C.dim,'right');}
  // level name (first seconds)
  if(L.time<3){ctx.globalAlpha=Math.min(1,3-L.time);otxt(L.def.name,W/2,H*0.2,PORTRAIT?24:30,L.kind==='town'?C.gold:C.red,'center');txt(L.def.sub,W/2,H*0.2+24,12,C.bone,'center');ctx.globalAlpha=1;}
}
// ---------- screens ----------
const SCR={items:[]};
function openScreen(s){if(G.screen==='play'){G.prev='play';}G.screen=s;G.sel=0;sfx('ui');}
function closeScreen(){G.screen='play';SCR.items=[];sfx('ui');}
function panel(title,w,h){const x=W/2-w/2,y=H/2-h/2;ctx.fillStyle='rgba(10,5,8,0.85)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#120609';rr(x,y,w,h,12);ctx.fill();ctx.strokeStyle='#c1121f';ctx.lineWidth=2;rr(x,y,w,h,12);ctx.stroke();txt(title,x+w/2,y+22,18,C.gold,'center');SCR.items=[];SCR.items.push({x:x+w-30,y:y+20,w:36,h:30,act:closeScreen,btn:'X'});return{x,y,w,h};}
function button(x,y,w,h,label,act,c){SCR.items.push({x:x,y:y,w,h,act});ctx.fillStyle=c||'#3a0d16';rr(x,y,w,h,6);ctx.fill();ctx.strokeStyle='#c1121f';ctx.lineWidth=1;rr(x,y,w,h,6);ctx.stroke();txt(label,x+w/2,y+h/2+1,Math.min(12,h*0.55),C.bone,'center');}
function itemLine(it){const parts=[];for(const k in it.s){const v=it.s[k];parts.push((k==='rate'||k==='spd'?'+'+Math.round(v*100)+'% ':'+'+v+' ')+({dmg:'damage',rate:'fire rate',shots:'bolts',pierce:'pierce',hp:'health',mana:'mana',aim:'aim',focus:'focus',def:'armor',spd:'speed',luck:'luck',jump:'double jump'}[k]));}return parts.join(', ');}
function drawScreens(){
  if(G.screen==='title'){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0508');g.addColorStop(1,'#3a0d16');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(193,18,31,0.2)';circ(W/2,H*0.32,H*0.2);ctx.fill();ctx.fillStyle='#c1121f';circ(W/2,H*0.32,H*0.13);ctx.fill();
    ctx.save();ctx.translate(W/2,H*0.32+H*0.13);ctx.scale(2.2,2.2);const hs=P.hurt;P.hurt=0;drawPlayer(0,-P.h/2,1,false);P.hurt=hs;ctx.restore();
    otxt('MAGELING',W/2,H*0.58,PORTRAIT?40:52,C.bone,'center');txt('a wizard, from the beginning',W/2,H*0.58+30,13,C.dim,'center');
    SCR.items=[];const bw=180;
    if(hasSave()){button(W/2-bw/2,H*0.7,bw,40,'Continue',()=>{load();G.screen='play';loadSeq(G.seq,true);G.fade=0;});button(W/2-bw/2,H*0.7+50,bw,34,'New game',()=>{P=newPlayer();G.seq=0;G.cleared=[];G.keys=[];G.towers=[];G.tut=0;G.screen='play';loadSeq(0,true);});}
    else button(W/2-bw/2,H*0.7,bw,40,'Begin',()=>{P=newPlayer();G.screen='play';loadSeq(0,true);});
    txt('Keys: A/D move · W/Space jump · 1-4 spells · B bag · U skills · H/M potions',W/2,H*0.92,PORTRAIT?9:11,C.dim,'center');
  }
  else if(G.screen==='bag'){
    const p=panel('Bag',Math.min(W-20,420),Math.min(H-20,PORTRAIT?520:360));const st=stats();
    let y=p.y+44;txt('Worn',p.x+14,y,11,C.dim);y+=14;
    for(const s of SLOTS){const it=P.gear[s];ctx.fillStyle='#1a0810';rr(p.x+12,y-2,p.w-24,26,5);ctx.fill();if(it)drawItemIcon(it,p.x+26,y+11,0.9);txt(s.charAt(0).toUpperCase()+s.slice(1)+': '+(it?it.n:'—'),p.x+42,y+6,11,it?RARC[it.r]:C.dim);if(it)txt(itemLine(it),p.x+42,y+18,8,C.dim);y+=30;}
    txt('Damage '+st.boltDmg+' · Bolts '+st.shots+' · Spread '+st.spread.toFixed(0)+'° · Misfire '+Math.round(st.fail*100)+'% · Armor '+st.def,p.x+14,y+4,9,C.bone);y+=22;
    txt('Carried ('+P.bag.length+')',p.x+14,y,11,C.dim);y+=14;
    const cols=PORTRAIT?1:2,cw=(p.w-24)/cols;
    P.bag.slice(0,PORTRAIT?7:10).forEach((it,i)=>{const cx=p.x+12+(i%cols)*cw,cy=y+Math.floor(i/cols)*30;const cur=P.gear[it.slot];const better=!cur||Object.values(it.s).reduce((a,b)=>a+b,0)>Object.values(cur.s).reduce((a,b)=>a+b,0);
      ctx.fillStyle='#1a0810';rr(cx,cy-2,cw-4,26,5);ctx.fill();drawItemIcon(it,cx+14,cy+11,0.9);txt(it.n,cx+30,cy+6,10,RARC[it.r]);txt(itemLine(it),cx+30,cy+18,7,C.dim);
      button(cx+cw-58,cy+1,50,20,better?'Equip ▲':'Equip',()=>equip(it),better?'#2a4a2a':'#3a0d16');});
    if(!P.bag.length)txt('Nothing yet. Items are rare — look in chests and towers.',p.x+14,y+8,9,C.dim);
  }
  else if(G.screen==='skill'){
    const p=panel('Skills  —  '+P.sp+' point'+(P.sp===1?'':'s')+' to spend',Math.min(W-20,420),Math.min(H-20,300));const st=stats();
    let y=p.y+50;
    const eff={aim:'spread '+st.spread.toFixed(0)+'°',focus:'misfire '+Math.round(st.fail*100)+'%',vigor:'health '+st.maxHp,arcana:'spell power x'+st.spellPow.toFixed(2),swift:'speed '+Math.round(st.spd)};
    for(const s of SKILLS){const v=P.skills[s.id];txt(s.name,p.x+14,y,12,C.bone);txt(s.desc+' · '+eff[s.id],p.x+14,y+14,8,C.dim);
      for(let i=0;i<10;i++){ctx.fillStyle=i<v?C.ember:'#2b2226';rr(p.x+150+i*16,y-5,12,10,2);ctx.fill();}
      if(P.sp>0&&v<10)button(p.x+p.w-56,y-8,44,26,'+1',()=>{P.skills[s.id]++;P.sp--;sfx('level');save();},'#5a0d14');
      y+=42;}
  }
  else if(G.screen==='shop'){
    const p=panel('Shop  —  '+P.gold+' gold',Math.min(W-20,400),Math.min(H-20,260));const n=G.shop;let y=p.y+50;
    txt('"'+n.line+'"',p.x+14,y,10,C.dim);y+=20;
    for(const s of n.stock){const label=s.potion?(s.potion==='hp'?'Health potion (+30)':'Mana potion (+30)'):s.item?s.item.n+' — '+itemLine(s.item):'Sold out';
      ctx.fillStyle='#1a0810';rr(p.x+12,y-4,p.w-24,30,5);ctx.fill();
      if(s.item)drawItemIcon(s.item,p.x+26,y+11,0.9);else if(s.potion){ctx.fillStyle=s.potion==='hp'?C.hp:C.mana;rr(p.x+22,y+4,8,12,3);ctx.fill();}
      txt(label,p.x+42,y+11,s.item?9:11,s.item?RARC[s.item.r]:C.bone);
      if(s.item||s.potion)button(p.x+p.w-84,y,72,22,s.price+' g',()=>{if(P.gold<s.price){toast('Not enough gold',C.dim);return;}P.gold-=s.price;sfx('pickup');if(s.potion)P.pots[s.potion]++;else{P.bag.push(s.item);toast('Bought: '+s.item.n,RARC[s.item.r]);s.item=null;}save();},P.gold>=s.price?'#5a3a1a':'#2b2226');
      y+=38;}
  }
  else if(G.screen==='pause'){const p=panel('Paused',260,200);button(p.x+40,p.y+60,180,36,'Resume',closeScreen);button(p.x+40,p.y+106,180,36,'Save and quit to title',()=>{save();G.screen='title';SCR.items=[];});txt(G.map?G.map.def.name:'',p.x+130,p.y+160,10,C.dim,'center');}
  else if(G.screen==='win'){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3a0d16');g.addColorStop(1,'#ffb347');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffe66d';circ(W/2,H*0.3,H*0.14);ctx.fill();ctx.save();ctx.translate(W/2,H*0.3+H*0.14+40);ctx.scale(2,2);drawPlayer(0,-P.h/2,1,false);ctx.restore();
    otxt('The sun returns.',W/2,H*0.68,PORTRAIT?26:34,C.bone,'center');txt('You were a child when you left Ashvale. You come home an elder, and the sky is gold again.',W/2,H*0.74,11,'#0a0508','center');
    SCR.items=[];button(W/2-90,H*0.84,180,36,'Back to title',()=>{G.screen='title';});
  }
}
function uiTap(x,y){for(const it of SCR.items){if(x>=it.x&&x<=it.x+it.w&&y>=it.y&&y<=it.y+it.h){it.act();return true;}}return false;}
function onKey(code){
  if(G.screen==='title'){if(code==='Enter'||code==='Space'){const b=SCR.items[0];if(b)b.act();}return;}
  if(G.screen!=='play'){if(code==='Escape'||code==='KeyB'||code==='KeyU'||code==='Tab'||code==='Enter'){if(G.screen==='win'){G.screen='title';}else closeScreen();}return;}
  if(G.dialog&&(code==='Enter'||code==='Space'||code==='KeyE')){G.dialog=null;return;}
  switch(code){case 'Digit1':case 'KeyJ':castSpell('fire');break;case 'Digit2':case 'KeyK':castSpell('frost');break;case 'Digit3':case 'KeyL':castSpell('heal');break;case 'Digit4':case 'KeyI':castSpell('zap');break;
    case 'KeyB':case 'Tab':openScreen('bag');break;case 'KeyU':openScreen('skill');break;case 'KeyH':usePot('hp');break;case 'KeyM':usePot('mp');break;case 'Escape':case 'Enter':openScreen('pause');break;}
}
// ---------- main loop ----------
let last=0;
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000||0.016);last=t;
  update(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.screen==='title'||G.screen==='win'){drawScreens();}
  else{
    const L=G.map;if(L){ctx.save();if(G.shake>0)ctx.translate(rnd(-1,1)*G.shake*8,rnd(-1,1)*G.shake*8);drawBackground(L);drawCeiling(L);drawLevel(L);drawPost(L);ctx.restore();drawHUD();}
    if(G.screen!=='play')drawScreens();
  }
  if(G.fade>0){ctx.fillStyle='rgba(10,5,8,'+clamp(G.fade,0,1)+')';ctx.fillRect(0,0,W,H);}
  requestAnimationFrame(frame);
}
function init(){resize();requestAnimationFrame(frame);}
init();
</script>
</body>
